<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js?v=20260302"></script>
        <style>
            :root {
                --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
                --color-primary-900: #0f172a;
                --color-primary-800: #1d2e4a;
                --color-accent-500: #c48a5a;
                --color-accent-600: #a86c44;
                --color-surface: #fcf9f4;
                --color-surface-soft: #f3ede3;
                --color-border-soft: #d8cebc;
                --color-text-primary: #1c2738;
                --color-text-muted: #616b7b;
                --gradient-bg-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --gradient-accent-main: linear-gradient(145deg, #d0a273 0%, #b2774a 100%);
                --gradient-accent-hover: linear-gradient(145deg, #ddb286 0%, #c48a5a 100%);
                --radius-sm: 10px;
                --radius-md: 14px;
                --radius-lg: 20px;
                --shadow-1: 0 10px 26px rgba(10, 18, 33, 0.16);
                --shadow-2: 0 24px 64px rgba(10, 18, 33, 0.32);
                --ease-emphasized: cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-family-base);
                background:
                    radial-gradient(circle at 14% 12%, rgba(196, 138, 90, 0.22), transparent 42%),
                    radial-gradient(circle at 90% 0%, rgba(244, 227, 202, 0.16), transparent 38%),
                    var(--gradient-bg-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                color: var(--color-text-primary);
            }

            .login-shell {
                width: 100%;
                max-width: 520px;
                position: relative;
                isolation: isolate;
            }

            .login-shell::before {
                content: '';
                position: absolute;
                inset: -14px;
                z-index: -1;
                background: radial-gradient(circle at 30% 25%, rgba(212, 165, 116, 0.28), transparent 58%);
                filter: blur(18px);
                opacity: 0.9;
            }

            .login-card {
                background: linear-gradient(160deg, color-mix(in srgb, var(--color-surface) 96%, white) 0%, var(--color-surface) 100%);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-2);
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 72%, white);
                padding: 44px 38px 34px;
                animation: cardEntrance 460ms var(--ease-emphasized) both;
            }

            @keyframes cardEntrance {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(0.985);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .login-header {
                text-align: center;
                margin-bottom: 26px;
            }

            /*.login-kicker {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 0.72rem;
                letter-spacing: 1px;
                text-transform: uppercase;
                font-weight: 800;
                color: var(--color-accent-600);
                background: linear-gradient(120deg, rgba(208, 162, 115, 0.18) 0%, rgba(196, 138, 90, 0.16) 100%);
                border: 1px solid rgba(208, 162, 115, 0.35);
                border-radius: 999px;
                padding: 6px 12px;
                margin-bottom: 14px;
            }*/

            h1 {
                color: var(--color-primary-900);
                font-size: 2rem;
                line-height: 1.18;
                margin-bottom: 8px;
                letter-spacing: 0.4px;
            }

            .login-subtitle {
                color: var(--color-text-muted);
                font-size: 0.96rem;
                line-height: 1.6;
                max-width: 46ch;
                margin: 0 auto;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .field-label {
                display: block;
                margin-bottom: 8px;
                color: var(--color-text-primary);
                font-size: 0.9rem;
                font-weight: 600;
                letter-spacing: 0.3px;
            }

            .field-wrap {
                position: relative;
                border-radius: 12px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 243, 236, 0.92) 100%);
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 72%, white);
                transition: transform 220ms var(--ease-emphasized), box-shadow 220ms ease, border-color 220ms ease;
            }

            .field-wrap:focus-within {
                transform: translateY(-1px);
                border-color: rgba(196, 138, 90, 0.5);
                box-shadow: 0 12px 24px rgba(24, 40, 67, 0.14), 0 0 0 3px rgba(196, 138, 90, 0.16);
            }

            .field-input {
                width: 100%;
                border: none;
                background: transparent;
                color: var(--color-text-primary);
                font-size: 0.98rem;
                font-family: var(--font-family-base);
                padding: 13px 14px;
                border-radius: inherit;
            }

            .field-input::placeholder {
                color: color-mix(in srgb, var(--color-text-muted) 70%, white);
            }

            .field-input:focus {
                outline: none;
            }

            .password-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding-right: 8px;
            }

            .password-row .field-input {
                flex: 1;
            }

            .toggle-btn {
                flex: 0 0 auto;
                min-width: 86px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 68%, white);
                border-radius: 9px;
                background: linear-gradient(145deg, #ffffff 0%, #f2ebdf 100%);
                color: var(--color-primary-800);
                font-size: 0.84rem;
                letter-spacing: 0.45px;
                font-weight: 700;
                padding: 9px 12px;
                cursor: pointer;
                transition: transform 220ms var(--ease-emphasized), box-shadow 220ms ease, border-color 220ms ease;
                box-shadow: 0 7px 16px rgba(20, 34, 58, 0.1);
            }

            .toggle-btn:hover {
                transform: translateY(-1px);
                border-color: rgba(196, 138, 90, 0.42);
                box-shadow: 0 10px 18px rgba(20, 34, 58, 0.14);
            }

            .submit-btn {
                width: 100%;
                margin-top: 10px;
                position: relative;
                overflow: hidden;
                border: none;
                border-radius: 11px;
                cursor: pointer;
                color: var(--color-surface);
                font-size: 0.98rem;
                font-weight: 700;
                letter-spacing: 0.9px;
                padding: 14px 22px;
                background: var(--gradient-accent-main);
                box-shadow: 0 14px 28px rgba(172, 117, 72, 0.35);
                transition: transform 220ms var(--ease-emphasized), box-shadow 220ms ease, background 220ms ease;
            }

            .submit-btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -120%;
                width: 60%;
                height: 100%;
                background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.46) 50%, transparent 100%);
                transition: left 420ms ease;
            }

            .submit-btn:hover {
                transform: translateY(-2px);
                background: var(--gradient-accent-hover);
                box-shadow: 0 18px 32px rgba(172, 117, 72, 0.42);
            }

            .submit-btn:hover::before {
                left: 115%;
            }

            .submit-btn:active {
                transform: translateY(0);
            }

            .submit-btn:disabled {
                cursor: not-allowed;
                opacity: 0.84;
                transform: none;
                box-shadow: 0 10px 18px rgba(172, 117, 72, 0.22);
            }

            .spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 3px solid rgba(255, 255, 255, 0.35);
                border-top-color: #fff;
                border-right-color: #fff;
                border-radius: 50%;
                animation: spin 0.85s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .message {
                margin-top: 16px;
                display: none;
                padding: 12px 14px;
                border-radius: 10px;
                font-size: 0.92rem;
                line-height: 1.45;
                font-weight: 600;
                animation: msgIn 260ms ease both;
            }

            .message.error {
                display: block;
                color: #7f232c;
                border: 1px solid #f1c2c8;
                background: linear-gradient(145deg, #feeff1 0%, #ffe5e8 100%);
            }

            .message.success {
                display: block;
                color: #1e5a33;
                border: 1px solid #bfe4c9;
                background: linear-gradient(145deg, #effcf4 0%, #dff4e7 100%);
            }

            @keyframes msgIn {
                from {
                    opacity: 0;
                    transform: translateY(-6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .auth-links,
            .back-link {
                margin-top: 18px;
                text-align: center;
                color: var(--color-text-muted);
                font-size: 0.9rem;
            }

            .auth-links a,
            .back-link a {
                color: var(--color-accent-600);
                text-decoration: none;
                font-weight: 700;
                letter-spacing: 0.3px;
                transition: color 180ms ease;
            }

            .auth-links a:hover,
            .back-link a:hover {
                color: var(--color-accent-500);
                text-decoration: underline;
            }

            .toast-container {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                max-width: 420px;
            }

            .toast {
                background: var(--color-surface);
                padding: 12px 16px;
                border-radius: 10px;
                box-shadow: var(--shadow-1);
                display: flex;
                gap: 10px;
                align-items: center;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 72%, white);
            }

            .toast.success {
                border-left: 4px solid #4caf50;
            }

            .toast.error {
                border-left: 4px solid #f44336;
            }

            .toast-icon {
                font-size: 1.05rem;
            }

            .toast-message {
                font-weight: 600;
                color: var(--color-text-primary);
            }

            .toast-close {
                margin-left: 8px;
                cursor: pointer;
                color: var(--color-text-muted);
            }

            :root {
                --motion-fast: 220ms;
                --motion-shine: 420ms;
                --motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
                --motion-standard: ease;
                --control-radius: 11px;
                --input-radius: 12px;
                --control-letter: 0.45px;
            }

            button,
            .submit-btn,
            .toggle-btn,
            .form-actions button,
            .edit-actions button,
            .navbar-actions button,
            .toolbar button,
            .btn,
            .action-btn {
                border-radius: var(--control-radius) !important;
                letter-spacing: var(--control-letter);
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="search"],
            select,
            textarea,
            .field-wrap,
            .field-input {
                border-radius: var(--input-radius);
            }

            button,
            .submit-btn,
            .toggle-btn,
            .field-wrap,
            .field-input {
                transition:
                    transform var(--motion-fast) var(--motion-ease),
                    box-shadow var(--motion-fast) var(--motion-standard),
                    background var(--motion-fast) var(--motion-standard),
                    border-color var(--motion-fast) var(--motion-standard),
                    color var(--motion-fast) var(--motion-standard);
            }

            .submit-btn::before {
                transition: left var(--motion-shine) var(--motion-standard);
            }

            @media (prefers-reduced-motion: reduce) {
                .login-card,
                .field-wrap,
                .toggle-btn,
                .submit-btn,
                .message,
                .spinner {
                    animation: none !important;
                    transition: none !important;
                }
            }

            @media (max-width: 520px) {
                .login-card {
                    padding: 34px 22px 24px;
                }

                h1 {
                    font-size: 1.66rem;
                }

                .toggle-btn {
                    min-width: 78px;
                    padding: 8px 10px;
                }
            }
        </style>
    </head>
    <body data-brand-page="login">
        <div class="toast-container" id="toastContainer"></div>

        <div class="login-shell">
            <div class="login-card">
                <div class="login-header">
                    <!--<span class="login-kicker">Editorial+SaaS Access</span>-->                    <h1>Welcome back</h1>
                    <p class="login-subtitle">Sign in with your username and password. Admin and member accounts use this same secure entry point.</p>
                </div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label class="field-label" for="username">Username</label>
                        <div class="field-wrap">
                            <input
                                class="field-input"
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="password">Password</label>
                        <div class="field-wrap password-row">
                            <input
                                class="field-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            />
                            <button type="button" class="toggle-btn" id="togglePwd" aria-label="Show or hide password">Show</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn">
                        <span id="btnText">Sign In</span>
                    </button>
                </form>

                <div id="message" class="message" role="alert"></div>

                <div class="auth-links">
                    <p>Don't have an account? <a href="/register.html">Sign up here</a></p>
                </div>

                <div class="back-link">
                    <a href="/" data-brand-copy="login.back">← Back to Stories</a>
                </div>
            </div>
        </div>

        <script>
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePwd = document.getElementById('togglePwd');

            function wireShowPassword(toggleBtn, input) {
                if (!toggleBtn || !input) return;
                toggleBtn.addEventListener('click', () => {
                    const showing = input.getAttribute('data-showing') === '1';
                    if (showing) {
                        input.type = 'password';
                        input.readOnly = false;
                        input.setAttribute('data-showing', '0');
                        toggleBtn.textContent = 'Show';
                    } else {
                        input.type = 'text';
                        input.readOnly = true;
                        input.setAttribute('data-showing', '1');
                        toggleBtn.textContent = 'Hide';
                    }
                });
            }

            wireShowPassword(togglePwd, passwordInput);

            function showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span><div class="toast-message">${message}</div><span class="toast-close">&times;</span>`;
                container.appendChild(toast);
                toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
                if (duration > 0) {
                    setTimeout(() => {
                        if (toast.parentElement) toast.remove();
                    }, duration);
                }
            }

            function showMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                showToast(text, type === 'error' ? 'error' : 'success', 3400);
            }

            function clearMessage() {
                messageDiv.className = 'message';
                messageDiv.textContent = '';
            }

            function validateForm() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username) {
                    showMessage('Please enter your username', 'error');
                    usernameInput.focus();
                    return false;
                }

                if (!password) {
                    showMessage('Please enter your password', 'error');
                    passwordInput.focus();
                    return false;
                }

                return true;
            }

            function safeReturnTo(target) {
                if (!target) return '';
                if (!target.startsWith('/')) return '';
                if (target.startsWith('//')) return '';
                if (target.includes('://')) return '';
                return target;
            }

            function getRedirectUrl(result, returnTo) {
                const next = safeReturnTo(returnTo);
                if (next) return next;
                if (result.emailVerified === false) return '/verify-email.html';
                return '/';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                btnText.innerHTML = '<span class="spinner"></span>Signing in...';

                const returnTo = (new URLSearchParams(window.location.search).get('returnTo') || '').toString();

                try {
                    const username = usernameInput.value.trim().toLowerCase();
                    const password = passwordInput.value;

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showMessage('✓ Login successful! Redirecting...', 'success');
                        const redirectTo = getRedirectUrl(result, returnTo);
                        setTimeout(() => {
                            if (typeof window.navigateWithTransition === 'function') {
                                window.navigateWithTransition(redirectTo);
                            } else {
                                window.location.href = redirectTo;
                            }
                        }, 650);
                        return;
                    }

                    showMessage(result.error || 'Login failed. Please try again.', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error: ' + (error.message || 'Please check your connection'), 'error');
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                }
            });
        </script>
    </body>
</html>
