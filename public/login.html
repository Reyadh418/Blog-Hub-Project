<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js"></script>
        <style>
            :root {
                --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
                --color-primary-900: #0f172a;
                --color-primary-800: #1d2e4a;
                --color-accent-500: #c48a5a;
                --color-accent-600: #a86c44;
                --color-surface: #fcf9f4;
                --color-surface-soft: #f3ede3;
                --color-border-soft: #d8cebc;
                --color-text-primary: #1c2738;
                --color-text-muted: #616b7b;
                --gradient-bg-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --gradient-accent-main: linear-gradient(145deg, #d0a273 0%, #b2774a 100%);
                --gradient-accent-hover: linear-gradient(145deg, #ddb286 0%, #c48a5a 100%);
                --radius-sm: 10px;
                --radius-md: 14px;
                --shadow-1: 0 10px 26px rgba(10, 18, 33, 0.16);
                --shadow-2: 0 24px 64px rgba(10, 18, 33, 0.32);
                --ease-emphasized: cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .is-hidden {
                display: none !important;
            }

            body {
                font-family: var(--font-family-base);
                background:
                    radial-gradient(circle at 14% 12%, rgba(196, 138, 90, 0.2), transparent 42%),
                    radial-gradient(circle at 90% 0%, rgba(244, 227, 202, 0.14), transparent 38%),
                    var(--gradient-bg-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .login-container {
                width: 100%;
                max-width: 450px;
            }

            .login-card {
                background: var(--color-surface);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-2);
                padding: 50px 40px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 76%, white);
            }

            .login-header {
                text-align: center;
                margin-bottom: 40px;
            }

            .login-icon {
                font-size: 3rem;
                margin-bottom: 16px;
            }

            h1 {
                color: var(--color-text-primary);
                font-size: 2rem;
                font-weight: 600;
                margin-bottom: 8px;
                letter-spacing: 0.5px;
            }

            .login-subtitle {
                color: var(--color-text-muted);
                font-size: 0.95rem;
                font-weight: 300;
                letter-spacing: 0.3px;
                max-width: 58ch;
                margin-left: auto;
                margin-right: auto;
                line-height: 1.6;
            }

            .mode-toggle {
                display: flex;
                gap: 12px;
                margin-bottom: 32px;
                background: #f8f9fa;
                padding: 8px;
                border-radius: 8px;
            }

            .mode-btn {
                flex: 1;
                padding: 10px 16px;
                border: none;
                border-radius: 6px;
                background: transparent;
                color: #7f8c8d;
                cursor: pointer;
                font-weight: 600;
                font-size: 0.9rem;
                transition: all 0.3s ease;
            }

            .mode-btn.active {
                background: var(--color-surface);
                color: var(--color-text-primary);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            form {
                display: flex;
                flex-direction: column;
            }

            .form-group {
                margin-bottom: 24px;
            }

            label {
                display: block;
                margin-bottom: 10px;
                color: #2c3e50;
                font-weight: 600;
                font-size: 0.95rem;
                letter-spacing: 0.4px;
            }

            input[type="text"],
            input[type="password"],
            input[type="email"] {
                width: 100%;
                padding: 14px 16px;
                border: 2px solid #e8e8e8;
                border-radius: 6px;
                font-size: 1rem;
                font-family: var(--font-family-base);
                transition: all 0.3s ease;
                background-color: #f8f9fa;
                color: #2c3e50;
            }

            input[type="text"]:focus,
            input[type="password"]:focus,
            input[type="email"]:focus {
                outline: none;
                border-color: #d4a574;
                background-color: #ffffff;
                box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
            }

            input::placeholder {
                color: #bdc3c7;
            }

            button {
                width: 100%;
                background: var(--gradient-accent-main);
                color: var(--color-surface);
                padding: 14px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 1rem;
                font-weight: 600;
                letter-spacing: 1px;
                transition: all 0.3s var(--ease-emphasized);
                box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3);
            }

            button:hover {
                background: var(--gradient-accent-hover);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(212, 165, 116, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.8;
                cursor: not-allowed;
            }

            button:disabled:hover {
                transform: none;
            }

            .spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .message {
                margin-top: 20px;
                padding: 14px 16px;
                border-radius: 6px;
                font-weight: 600;
                text-align: center;
                font-size: 0.95rem;
                display: none;
                animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .message.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                display: block;
            }

            .message.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
                display: block;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .auth-links {
                text-align: center;
                margin-top: 20px;
                font-size: 0.9rem;
                color: var(--color-text-muted);
            }

            .auth-links a {
                color: var(--color-accent-500);
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s ease;
            }

            .auth-links a:hover {
                color: #e8b896;
                text-decoration: underline;
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: var(--color-accent-500);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.9rem;
                transition: color 0.3s ease;
            }

            .back-link a:hover {
                color: #e8b896;
                text-decoration: underline;
            }

            @media (max-width: 480px) {
                .login-card {
                    padding: 30px 20px;
                }

                h1 {
                    font-size: 1.6rem;
                }

                .login-icon {
                    font-size: 2.5rem;
                }
            }
            /* Toast Notifications */
            .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; max-width: 420px; }
            .toast { background: var(--color-surface); padding:12px 16px; border-radius:8px; box-shadow: var(--shadow-1); display:flex; gap:10px; align-items:center; }
            .toast.success { border-left:4px solid #4CAF50; } .toast.error { border-left:4px solid #f44336; }
            .toast-icon{font-size:1.1rem;} .toast-message{font-weight:600;color:#222;} .toast-close{margin-left:8px;cursor:pointer;color:#777}
            .password-row {
                display: flex;
                gap: 10px;
                align-items: center;
                background: #f5f7fb;
                border: 1px solid #e2e6ee;
                border-radius: 10px;
                padding: 6px 8px;
            }

            .password-row input {
                flex: 1;
                border: none;
                background: transparent;
                padding: 12px 14px;
                font-size: 1rem;
            }

            .password-row input:focus {
                outline: none;
                box-shadow: none;
            }

            .toggle-btn {
                flex: 0 0 auto;
                width: auto;
                min-width: 90px;
                height: 100%;
                padding: 12px 16px;
                white-space: nowrap;
                background: linear-gradient(135deg, #ffffff 0%, #e7ecf5 100%);
                color: #1e3a5f;
                border: 1px solid #d8dde9;
                border-radius: 8px;
                font-weight: 700;
                font-size: 0.95rem;
                cursor: pointer;
                transition: all 0.25s ease;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
            }

            .toggle-btn:hover {
                background: linear-gradient(135deg, #ffffff 0%, #dde3ef 100%);
                transform: translateY(-1px);
            }

            .toggle-btn:active {
                transform: translateY(0);
            }
        </style>
    </head>
    <body data-brand-page="login">
        <div class="toast-container" id="toastContainer"></div>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon" id="headerIcon">👤</div>
                    <h1 id="headerTitle">User Login</h1>
                    <p class="login-subtitle" id="headerSubtitle">Sign in to your account</p>
                </div>

                <div class="mode-toggle">
                    <button class="mode-btn active" id="userModeBtn" onclick="switchMode('user')">User</button>
                    <button class="mode-btn" id="adminModeBtn" onclick="switchMode('admin')">Admin</button>
                </div>

                <form id="loginForm" novalidate>
                    <!-- User mode fields -->
                    <div id="userFields">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username"
                                autocomplete="username"
                            />
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-row">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                />
                                <button type="button" class="toggle-btn" id="toggleUserPwd">Show</button>
                            </div>
                        </div>
                    </div>

                    <!-- Admin mode fields -->
                    <div id="adminFields" class="is-hidden">
                        <div class="form-group">
                            <label for="adminUsername">Admin Username</label>
                            <input 
                                type="text" 
                                id="adminUsername" 
                                placeholder="Enter admin username"
                                autocomplete="username"
                            />
                        </div>

                        <div class="form-group">
                            <label for="adminPassword">Admin Password</label>
                            <div class="password-row">
                                <input 
                                    type="password" 
                                    id="adminPassword" 
                                    placeholder="Enter admin password"
                                    autocomplete="current-password"
                                />
                                <button type="button" class="toggle-btn" id="toggleAdminPwd">Show</button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="btnText">Sign In</span>
                    </button>
                </form>

                <div id="message" class="message" role="alert"></div>

                <div id="userAuthLinks" class="auth-links">
                    <p>Don't have an account? <a href="/register.html">Sign up here</a></p>
                </div>

                <div class="back-link">
                    <a href="/" data-brand-copy="login.back">← Back to Stories</a>
                </div>
            </div>
        </div>

        <script>
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const toggleUserPwd = document.getElementById('toggleUserPwd');
            const toggleAdminPwd = document.getElementById('toggleAdminPwd');
            const userPwdInput = document.getElementById('password');
            const adminPwdInput = document.getElementById('adminPassword');

            function wireShowPassword(toggleBtn, input) {
                if (!toggleBtn || !input) return;
                toggleBtn.addEventListener('click', () => {
                    const showing = input.getAttribute('data-showing') === '1';
                    if (showing) {
                        input.type = 'password';
                        input.readOnly = false;
                        input.setAttribute('data-showing', '0');
                        toggleBtn.textContent = 'Show';
                    } else {
                        input.type = 'text';
                        input.readOnly = true;
                        input.setAttribute('data-showing', '1');
                        toggleBtn.textContent = 'Hide';
                    }
                });
            }

            let currentMode = 'user';

            function switchMode(mode) {
                currentMode = mode;
                const userModeBtn = document.getElementById('userModeBtn');
                const adminModeBtn = document.getElementById('adminModeBtn');
                const userFields = document.getElementById('userFields');
                const adminFields = document.getElementById('adminFields');
                const headerIcon = document.getElementById('headerIcon');
                const headerTitle = document.getElementById('headerTitle');
                const headerSubtitle = document.getElementById('headerSubtitle');
                const userAuthLinks = document.getElementById('userAuthLinks');

                if (mode === 'user') {
                    userModeBtn.classList.add('active');
                    adminModeBtn.classList.remove('active');
                    userFields.classList.remove('is-hidden');
                    adminFields.classList.add('is-hidden');
                    headerIcon.textContent = '👤';
                    headerTitle.textContent = 'User Login';
                    headerSubtitle.textContent = 'Sign in to your account';
                    userAuthLinks.classList.remove('is-hidden');
                } else {
                    userModeBtn.classList.remove('active');
                    adminModeBtn.classList.add('active');
                    userFields.classList.add('is-hidden');
                    adminFields.classList.remove('is-hidden');
                    headerIcon.textContent = '🔐';
                    headerTitle.textContent = 'Admin Login';
                    headerSubtitle.textContent = 'Secure access for admins';
                    userAuthLinks.classList.add('is-hidden');
                }
                messageDiv.className = 'message';
                messageDiv.textContent = '';
            }

            wireShowPassword(toggleUserPwd, userPwdInput);
            wireShowPassword(toggleAdminPwd, adminPwdInput);

            // Support deep-linking to admin login mode
            const initialMode = (new URLSearchParams(window.location.search).get('mode') || '').toLowerCase();
            if (initialMode === 'admin') {
                switchMode('admin');
            }

            // Toast system
            function showToast(message, type='info', duration=3000) {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span class="toast-icon">${type==='success'?'✓':type==='error'?'✕':'ℹ'}</span><div class="toast-message">${message}</div><span class="toast-close">&times;</span>`;
                container.appendChild(toast);
                toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
                if (duration>0) setTimeout(()=> { if (toast.parentElement) toast.remove(); }, duration);
            }

            function showMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                showToast(text, type==='error'?'error':'success', 3500);
            }

            function validateForm() {
                if (currentMode === 'user') {
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;

                    if (!username) {
                        showMessage('Please enter your username', 'error');
                        document.getElementById('username').focus();
                        return false;
                    }

                    if (!password) {
                        showMessage('Please enter your password', 'error');
                        document.getElementById('password').focus();
                        return false;
                    }
                } else {
                    const adminUsername = document.getElementById('adminUsername').value.trim();
                    const adminPassword = document.getElementById('adminPassword').value;

                    if (!adminUsername) {
                        showMessage('Please enter admin username', 'error');
                        document.getElementById('adminUsername').focus();
                        return false;
                    }

                    if (!adminPassword) {
                        showMessage('Please enter admin password', 'error');
                        document.getElementById('adminPassword').focus();
                        return false;
                    }
                }

                return true;
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                btnText.innerHTML = '<span class="spinner"></span>Signing in...';

                const returnTo = (new URLSearchParams(window.location.search).get('returnTo') || '').toString();
                function safeReturnTo(target) {
                    if (!target) return '';
                    if (!target.startsWith('/')) return '';
                    if (target.startsWith('//')) return '';
                    if (target.includes('://')) return '';
                    return target;
                }

                // Helper function to determine redirect URL based on user type
                // Everyone goes to homepage after login - they can navigate to profile from there
                function getRedirectUrl(result) {
                    const next = safeReturnTo(returnTo);
                    if (next) return next;
                    if (result.emailVerified === false) return '/verify-email.html';
                    return '/';
                }

                try {
                    if (currentMode === 'user') {
                        const username = document.getElementById('username').value.trim().toLowerCase();
                        const password = document.getElementById('password').value;

                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ username, password }),
                        });

                        const result = await response.json();

                        if (response.ok) {
                            showMessage('✓ Login successful! Redirecting...', 'success');
                            setTimeout(() => {
                                window.location.href = getRedirectUrl(result);
                            }, 1500);
                        } else {
                            showMessage(result.error || 'Login failed. Please try again.', 'error');
                            submitBtn.disabled = false;
                            btnText.textContent = originalText;
                            document.getElementById('password').value = '';
                            document.getElementById('password').focus();
                        }
                    } else {
                        const username = document.getElementById('adminUsername').value.toString();
                        const password = document.getElementById('adminPassword').value.toString();

                        const response = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ username, password }),
                        });

                        const result = await response.json();

                        if (response.ok) {
                            showMessage('✓ Admin login successful! Redirecting...', 'success');
                            setTimeout(() => {
                                window.location.href = getRedirectUrl(result);
                            }, 1500);
                        } else {
                            showMessage(result.error || 'Login failed. Please try again.', 'error');
                            submitBtn.disabled = false;
                            btnText.textContent = originalText;
                            document.getElementById('adminPassword').value = '';
                            document.getElementById('adminPassword').focus();
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error: ' + (error.message || 'Please check your connection'), 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                }
            });
        </script>
    </body>
</html>
