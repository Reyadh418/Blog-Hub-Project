<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js?v=20260302"></script>
                                <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
            
            * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            
            body[data-brand-page="login"] { 
                min-height: 100vh; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                padding: 24px; 
                background-color: #000;
                overflow: hidden;
                color: rgba(255, 255, 255, 0.95) !important;
            }

            /* Liquid Aurora Background */
            body[data-brand-page="login"] .bg-aurora {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -1;
                background: linear-gradient(125deg, #0f0c29, #302b63, #24243e);
                overflow: hidden;
            }
            body[data-brand-page="login"] .bg-aurora::before, 
            body[data-brand-page="login"] .bg-aurora::after, 
            body[data-brand-page="login"] .bg-blob {
                content: '';
                position: absolute;
                border-radius: 50%;
                filter: blur(80px);
                animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            }
            body[data-brand-page="login"] .bg-aurora::before {
                width: 50vw; height: 50vh;
                background: #ff2a85; /* Vibrant pink/magenta */
                top: -10%; left: -10%;
                opacity: 0.6;
            }
            body[data-brand-page="login"] .bg-aurora::after {
                width: 60vw; height: 60vh;
                background: #8a2387; /* Purple */
                bottom: -20%; right: -10%;
                animation-delay: -5s;
                animation-duration: 25s;
                opacity: 0.6;
            }
            body[data-brand-page="login"] .bg-blob {
                width: 55vw; height: 55vh;
                background: #e94057; /* Reddish orange */
                top: 40%; left: 30%;
                animation-delay: -10s;
                animation-duration: 22s;
                opacity: 0.5;
            }

            @keyframes float {
                0% { transform: translate(0, 0) scale(1); }
                33% { transform: translate(10vw, 15vh) scale(1.1); }
                66% { transform: translate(-10vw, -10vh) scale(0.9); }
                100% { transform: translate(5vw, 5vh) scale(1.05); }
            }

            .login-shell { width: 100%; max-width: 440px; position: relative; isolation: isolate; z-index: 10;}
            
            /* Premium Apple-Style Glass Card */
            .login-shell .login-card { 
                padding: 48px 40px; 
                border-radius: 32px !important;
                background: rgba(25, 25, 30, 0.65) !important; 
                color: #ffffff !important;
                backdrop-filter: blur(40px) saturate(180%) !important;
                -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
                border: 1px solid rgba(255, 255, 255, 0.15) !important;
                box-shadow: 
                    0 24px 64px rgba(0, 0, 0, 0.4),
                    inset 0 1px 1px rgba(255, 255, 255, 0.1),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.05) !important;
                animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; 
            }
            .login-shell .login-card::before, .login-shell .login-card::after { display: none !important; }
            .login-shell .login-card:hover { transform: none !important; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1), inset 0 -1px 1px rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; }
            
            @keyframes cardEntrance {
                from { opacity: 0; transform: translateY(30px) scale(0.95); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }

            .login-shell .login-header { text-align: center; margin-bottom: 36px; position: relative; z-index: 2; }
            .login-shell h1 { font-size: 2rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.5px; color: #ffffff !important; text-shadow: 0 2px 10px rgba(0,0,0,0.3) !important; background: none !important; -webkit-text-fill-color: initial !important; }
            .login-shell .login-card p.login-subtitle { font-size: 0.95rem; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.85) !important; max-width: 300px; margin: 0 auto; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
            
            /* Reset global form styling injected by liquid-glass.css */
            form#loginForm { background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; transform: none !important; margin: 0 !important; overflow: visible !important; }
            form#loginForm::before, form#loginForm::after { display: none !important; }
            form#loginForm::before, form#loginForm::after { display: none !important; }
            form#loginForm *::before, form#loginForm *::after { display: none !important; }
            form#loginForm:hover { transform: none !important; box-shadow: none !important; border: none !important; background: transparent !important; }
            
            /* Override deep text colors injected by liquid-glass.css */
            .login-shell .login-card p,
            .login-shell .login-card span,
            form#loginForm span {
                color: inherit !important;
            }
            
            form#loginForm .form-group { margin-bottom: 20px; position: relative; z-index: 2; }
            form#loginForm .field-label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.95) !important; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
            
            /* Apple-Style Input Wrappers */
            form#loginForm .field-wrap { 
                position: relative; 
                border-radius: 16px !important; 
                background: rgba(0, 0, 0, 0.3) !important; 
                border: 1px solid rgba(255, 255, 255, 0.08) !important; 
                box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2) !important; 
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden !important; 
                transform: translateZ(0); 
                -webkit-mask-image: -webkit-radial-gradient(white, black);
            }
            form#loginForm .field-wrap:focus-within { border-color: rgba(255, 255, 255, 0.3) !important; background: rgba(0, 0, 0, 0.4) !important; box-shadow: 0 0 0 4px rgba(255,255,255,0.05), inset 0 2px 4px rgba(0, 0, 0, 0.3) !important; }
            
            form#loginForm .field-input { width: 100%; border: none !important; background: transparent !important; font-size: 0.95rem; padding: 16px !important; border-radius: 16px !important; color: #ffffff !important; font-weight: 500; box-shadow: none !important; outline: none !important; }
            form#loginForm .field-input::placeholder { color: rgba(255,255,255,0.5) !important; font-weight: 400; }
            form#loginForm .field-input:focus { outline: none !important; box-shadow: none !important; background: transparent !important; border: none !important; }
            
            form#loginForm .password-row { display: flex; align-items: center; padding-right: 8px; }
            form#loginForm .password-row .field-input { flex: 1; }
            
            /* Glass Buttons */
            form#loginForm .toggle-btn { flex: 0 0 auto; min-width: 74px; margin-left: 8px; border: 1px solid rgba(255, 255, 255, 0.15) !important; border-radius: 10px !important; background: rgba(255, 255, 255, 0.08) !important; color: rgba(255,255,255,0.95) !important; font-size: 0.8rem; font-weight: 500; padding: 8px 12px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px); box-shadow: none !important; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
            form#loginForm .toggle-btn:hover { background: rgba(255, 255, 255, 0.2) !important; color: #ffffff !important; transform: none !important; }
            
            form#loginForm .submit-btn { 
                width: 100%; 
                margin-top: 24px; 
                position: relative;
                z-index: 2;
                border: 1px solid rgba(255, 255, 255, 0.2) !important; 
                border-radius: 16px !important; 
                cursor: pointer; 
                color: #ffffff !important; 
                font-size: 1.05rem; 
                font-weight: 600; 
                letter-spacing: 0.5px;
                text-shadow: 0 1px 4px rgba(0,0,0,0.3);
                padding: 18px; 
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%) !important;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3) !important; 
                backdrop-filter: blur(20px);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden !important; 
                transform: translateZ(0); 
                -webkit-mask-image: -webkit-radial-gradient(white, black);
            }
            form#loginForm .submit-btn:hover { 
                transform: translateY(-2px) !important; 
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.1) 100%) !important;
                border-color: rgba(255, 255, 255, 0.4) !important;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important; 
            }
            form#loginForm .submit-btn:active { transform: translateY(0) scale(0.98) !important; }
            
            /* Messages and Links */
            .login-shell .message { margin-top: 20px; display: none; padding: 14px 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 500; text-align: center; border: 1px solid rgba(255,255,255,0.2) !important; }
            .login-shell .message.error { display: block; color: #ff8a8a !important; background: rgba(255, 50, 50, 0.1) !important; border-color: rgba(255, 50, 50, 0.2) !important; }
            .login-shell .message.success { display: block; color: #8aff96 !important; background: rgba(50, 255, 50, 0.1) !important; border-color: rgba(50, 255, 50, 0.2) !important; }
            
            .login-shell .auth-links, .login-shell .back-link { margin-top: 24px; text-align: center; font-size: 0.95rem; color: rgba(255,255,255,0.75) !important; position: relative; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
            .login-shell .auth-links a, .login-shell .back-link a { color: #ffffff !important; text-decoration: none; font-weight: 600; transition: all 0.2s; opacity: 0.9; }
            .login-shell .auth-links a:hover, .login-shell .back-link a:hover { opacity: 1; text-decoration: underline; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
            
            .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; max-width: 400px; }
            .toast { padding: 16px 20px; border-radius: 16px !important; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; background: rgba(30,30,35,0.7) !important; color: white !important; border: 1px solid rgba(255,255,255,0.15) !important; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important; animation: toastIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
            @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
            
            .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
            @keyframes spin { to { transform: rotate(360deg); } }
            
            @media (max-width: 520px) {
                .login-shell .login-card { padding: 40px 24px; border-radius: 28px !important; }
                .login-shell h1 { font-size: 1.8rem; }
            }
        </style>
    </head>
    <body data-brand-page="login">
        <div class="bg-aurora"><div class="bg-blob"></div></div>
        <div class="toast-container" id="toastContainer"></div>

        <div class="login-shell">
            <div class="login-card">
                <div class="login-header">
                    <!--<span class="login-kicker">Editorial+SaaS Access</span>-->                    <h1>Welcome back</h1>
                    <p class="login-subtitle">Sign in with your username and password. Admin and member accounts use this same secure entry point.</p>
                </div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label class="field-label" for="username">Username</label>
                        <div class="field-wrap">
                            <input
                                class="field-input"
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="password">Password</label>
                        <div class="field-wrap password-row">
                            <input
                                class="field-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            />
                            <button type="button" class="toggle-btn" id="togglePwd" aria-label="Show or hide password">Show</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn">
                        <span id="btnText">Sign In</span>
                    </button>
                </form>

                <div id="message" class="message" role="alert"></div>

                <div class="auth-links">
                    <p>Don't have an account? <a href="/register.html">Sign up here</a></p>
                </div>

                <div class="back-link">
                    <a href="/" data-brand-copy="login.back">← Back to Stories</a>
                </div>
            </div>
        </div>

        <script>
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePwd = document.getElementById('togglePwd');

            function wireShowPassword(toggleBtn, input) {
                if (!toggleBtn || !input) return;
                toggleBtn.addEventListener('click', () => {
                    const showing = input.getAttribute('data-showing') === '1';
                    if (showing) {
                        input.type = 'password';
                        input.setAttribute('data-showing', '0');
                        toggleBtn.textContent = 'Show';
                    } else {
                        input.type = 'text';
                        input.setAttribute('data-showing', '1');
                        toggleBtn.textContent = 'Hide';
                    }
                });
            }

            wireShowPassword(togglePwd, passwordInput);

            function showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span><div class="toast-message">${message}</div><span class="toast-close">&times;</span>`;
                container.appendChild(toast);
                toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
                if (duration > 0) {
                    setTimeout(() => {
                        if (toast.parentElement) toast.remove();
                    }, duration);
                }
            }

            function showMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                showToast(text, type === 'error' ? 'error' : 'success', 3400);
            }

            function clearMessage() {
                messageDiv.className = 'message';
                messageDiv.textContent = '';
            }

            function validateForm() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username) {
                    showMessage('Please enter your username', 'error');
                    usernameInput.focus();
                    return false;
                }

                if (!password) {
                    showMessage('Please enter your password', 'error');
                    passwordInput.focus();
                    return false;
                }

                return true;
            }

            function safeReturnTo(target) {
                if (!target) return '';
                if (!target.startsWith('/')) return '';
                if (target.startsWith('//')) return '';
                if (target.includes('://')) return '';
                return target;
            }

            function getRedirectUrl(result, returnTo) {
                const next = safeReturnTo(returnTo);
                if (next) return next;
                if (result.emailVerified === false) return '/verify-email.html';
                return '/';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                btnText.innerHTML = '<span class="spinner"></span>Signing in...';

                const returnTo = (new URLSearchParams(window.location.search).get('returnTo') || '').toString();

                try {
                    const username = usernameInput.value.trim().toLowerCase();
                    const password = passwordInput.value;

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showMessage('✓ Login successful! Redirecting...', 'success');
                        const redirectTo = getRedirectUrl(result, returnTo);
                        setTimeout(() => {
                            if (typeof window.navigateWithTransition === 'function') {
                                window.navigateWithTransition(redirectTo);
                            } else {
                                window.location.href = redirectTo;
                            }
                        }, 650);
                        return;
                    }

                    showMessage(result.error || 'Login failed. Please try again.', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error: ' + (error.message || 'Please check your connection'), 'error');
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                }
            });
        </script>
    </body>
</html>
