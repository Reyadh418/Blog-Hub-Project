<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verify Email - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js?v=20260302"></script>
        <style>
            :root {
                --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
                --color-primary-900: #0f172a;
                --color-primary-800: #1d2e4a;
                --color-accent-500: #c48a5a;
                --color-accent-600: #a86c44;
                --color-surface: #fcf9f4;
                --color-surface-soft: #f3ede3;
                --color-border-soft: #d8cebc;
                --color-text-muted: #616b7b;
                --gradient-bg-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --gradient-accent-main: linear-gradient(145deg, #d0a273 0%, #b2774a 100%);
                --gradient-primary-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --radius-sm: 10px;
                --radius-md: 14px;
                --shadow-1: 0 24px 64px rgba(10, 18, 33, 0.32);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .is-hidden { display: none !important; }

            body {
                font-family: var(--font-family-base);
                background:
                    radial-gradient(circle at 14% 12%, rgba(196, 138, 90, 0.2), transparent 42%),
                    radial-gradient(circle at 90% 0%, rgba(244, 227, 202, 0.14), transparent 38%),
                    var(--gradient-bg-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .verify-container {
                width: 100%;
                max-width: 480px;
            }

            .verify-card {
                background: var(--color-surface);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-1);
                padding: 50px 40px;
                text-align: center;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 76%, white);
            }

            .verify-icon {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }

            h1 {
                color: var(--color-primary-900);
                font-size: 1.8rem;
                font-weight: 600;
                margin-bottom: 8px;
                letter-spacing: 0.5px;
            }

            .verify-subtitle {
                color: var(--color-text-muted);
                font-size: 0.95rem;
                font-weight: 300;
                margin-bottom: 8px;
                line-height: 1.5;
                max-width: 54ch;
                margin-left: auto;
                margin-right: auto;
            }

            .verify-email-display {
                color: var(--color-primary-900);
                font-weight: 600;
                font-size: 1rem;
                margin-bottom: 32px;
            }

            .code-input-group {
                display: flex;
                gap: 8px;
                justify-content: center;
                margin-bottom: 24px;
            }

            .code-digit {
                width: 50px;
                height: 60px;
                border: 2px solid #e8e8e8;
                border-radius: 8px;
                font-size: 1.5rem;
                font-weight: 700;
                text-align: center;
                color: var(--color-primary-800);
                background: #f8f9fa;
                transition: all 0.3s ease;
                font-family: 'Segoe UI', monospace;
            }

            .code-digit:focus {
                outline: none;
                border-color: var(--color-accent-500);
                background: #ffffff;
                box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
            }

            .code-digit.filled {
                border-color: var(--color-primary-800);
                background: #f0f4f8;
            }

            .code-digit.error {
                border-color: #e74c3c;
                background: #fdf2f2;
                animation: shake 0.4s ease;
            }

            .code-digit.success {
                border-color: #27ae60;
                background: #f0faf4;
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-4px); }
                75% { transform: translateX(4px); }
            }

            .verify-btn {
                width: 100%;
                padding: 14px;
                border: none;
                border-radius: 8px;
                background: var(--gradient-accent-main);
                color: var(--color-surface);
                font-size: 1.05rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-bottom: 16px;
            }

            .verify-btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(212, 165, 116, 0.4);
            }

            .verify-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .resend-section {
                margin-top: 20px;
                padding-top: 20px;
                border-top: 1px solid #e8e8e8;
            }

            .resend-text {
                color: var(--color-text-muted);
                font-size: 0.9rem;
                margin-bottom: 12px;
            }

            .resend-btn {
                background: none;
                border: 2px solid var(--color-primary-900);
                color: var(--color-primary-900);
                padding: 10px 24px;
                border-radius: 8px;
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .resend-btn:hover:not(:disabled) {
                background: var(--color-primary-900);
                color: var(--color-surface);
            }

            .resend-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .countdown {
                color: var(--color-accent-500);
                font-weight: 600;
            }

            .message {
                padding: 12px 16px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 0.9rem;
                font-weight: 500;
                display: none;
            }

            .message.success {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
                display: block;
            }

            .message.error {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                display: block;
            }

            .message.info {
                background: #e8f0fe;
                color: var(--color-primary-800);
                border: 1px solid #c9daf8;
                display: block;
            }

            .skip-link {
                display: inline-block;
                margin-top: 16px;
                color: #95a5a6;
                text-decoration: none;
                font-size: 0.85rem;
                transition: color 0.2s;
            }

            .skip-btn {
                width: 100%;
                margin-top: 14px;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 86%, white);
                background: #fff;
                color: var(--color-primary-800);
                font-weight: 600;
                font-size: 0.94rem;
                cursor: pointer;
                transition: all 0.25s ease;
            }

            .skip-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
            }

            .skip-link:hover {
                color: #7f8c8d;
            }

            .spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 2px solid rgba(255,255,255,0.3);
                border-top-color: #fff;
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                vertical-align: middle;
                margin-right: 8px;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .already-verified h2 {
                color: #27ae60;
                font-size: 1.5rem;
                margin-bottom: 12px;
            }

            .already-verified p {
                color: #7f8c8d;
                margin-bottom: 20px;
            }

            .continue-btn {
                display: inline-block;
                padding: 12px 32px;
                background: var(--gradient-primary-main);
                color: var(--color-surface);
                text-decoration: none;
                border-radius: 8px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .continue-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(30, 58, 95, 0.4);
            }

            @media (max-width: 500px) {
                .verify-card {
                    padding: 26px 16px;
                }

                h1 {
                    font-size: 1.45rem;
                }

                .verify-subtitle {
                    font-size: 0.9rem;
                }

                .code-digit {
                    width: 40px;
                    height: 48px;
                    font-size: 1.2rem;
                }

                .code-input-group {
                    gap: 8px;
                }

                .verify-actions {
                    flex-direction: column;
                    gap: 10px;
                }

                .verify-btn,
                .resend-btn,
                .skip-btn,
                .continue-btn {
                    width: 100%;
                }
            }

            .verify-card {
                animation: cardEntrance 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            @keyframes cardEntrance {
                from { opacity: 0; transform: translateY(12px) scale(0.985); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }

            .code-digit {
                background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(248,243,236,0.96) 100%);
                border-color: color-mix(in srgb, var(--color-border-soft) 78%, white);
            }

            .verify-btn,
            .resend-btn,
            .skip-btn,
            .continue-btn {
                position: relative;
                overflow: hidden;
                border-radius: 11px;
                transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 220ms ease, background 220ms ease;
            }

            .verify-btn::before,
            .continue-btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -120%;
                width: 60%;
                height: 100%;
                background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.44) 50%, transparent 100%);
                transition: left 420ms ease;
            }

            .verify-btn:hover::before,
            .continue-btn:hover::before {
                left: 115%;
            }

            .verify-btn:hover:not(:disabled),
            .resend-btn:hover:not(:disabled),
            .skip-btn:hover:not(:disabled),
            .continue-btn:hover {
                transform: translateY(-2px);
            }

            :root {
                --motion-fast: 220ms;
                --motion-shine: 420ms;
                --motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
                --motion-standard: ease;
                --control-radius: 11px;
                --input-radius: 12px;
                --control-letter: 0.45px;
            }

            button,
            .submit-btn,
            .verify-btn,
            .resend-btn,
            .skip-btn,
            .continue-btn,
            .toggle-btn,
            .form-actions button,
            .edit-actions button,
            .navbar-actions button,
            .toolbar button,
            .btn,
            .action-btn {
                border-radius: var(--control-radius) !important;
                letter-spacing: var(--control-letter);
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="search"],
            select,
            textarea,
            .field-wrap,
            .field-input,
            .code-digit {
                border-radius: var(--input-radius);
            }

            .code-digit,
            .verify-btn,
            .resend-btn,
            .skip-btn,
            .continue-btn {
                transition:
                    transform var(--motion-fast) var(--motion-ease),
                    box-shadow var(--motion-fast) var(--motion-standard),
                    background var(--motion-fast) var(--motion-standard),
                    border-color var(--motion-fast) var(--motion-standard),
                    color var(--motion-fast) var(--motion-standard);
            }

            .verify-btn::before,
            .continue-btn::before {
                transition: left var(--motion-shine) var(--motion-standard);
            }

            @media (prefers-reduced-motion: reduce) {
                .verify-card,
                .code-digit,
                .verify-btn,
                .resend-btn,
                .skip-btn,
                .continue-btn {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body data-brand-page="verify-email">
        <div class="verify-container">
            <div class="verify-card" id="verifyCard">
                <div class="verify-icon">📧</div>
                <h1>Verify Your Email</h1>
                <p class="verify-subtitle">Send a 6-digit code to</p>
                <p class="verify-email-display" id="emailDisplay">loading...</p>

                <div id="messageBox" class="message"></div>

                <div class="code-input-group" id="codeGroup">
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0" autocomplete="one-time-code" />
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1" />
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2" />
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3" />
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4" />
                    <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5" />
                </div>

                <button class="verify-btn" id="verifyBtn" disabled>Verify Email</button>

                <div class="resend-section">
                    <p class="resend-text">Send your verification code first</p>
                    <button class="resend-btn" id="sendCodeBtn">Send Code</button>
                    <p class="resend-text is-hidden" id="resendPrompt">Didn't receive the code?</p>
                    <button class="resend-btn is-hidden" id="resendBtn">Resend Code</button>
                    <p class="resend-text is-hidden" id="resendCooldown">
                        Resend available in <span class="countdown" id="countdown"></span>
                    </p>
                </div>

                <button type="button" class="skip-btn" id="skipVerifyBtn">Skip for now</button>
                <a href="/" class="skip-link">I'll verify later</a>
            </div>

            <div class="verify-card already-verified is-hidden" id="alreadyVerified">
                <div class="verify-icon">✅</div>
                <h2>Email Verified!</h2>
                <p>Your email has been verified. You're all set!</p>
                <a href="/" class="continue-btn" data-brand-copy="verify.continue">Continue to Stories Hub</a>
            </div>
        </div>

        <script>
            const digits = document.querySelectorAll('.code-digit');
            const verifyBtn = document.getElementById('verifyBtn');
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            const resendBtn = document.getElementById('resendBtn');
            const resendPrompt = document.getElementById('resendPrompt');
            const messageBox = document.getElementById('messageBox');
            const emailDisplay = document.getElementById('emailDisplay');
            const verifyCard = document.getElementById('verifyCard');
            const alreadyVerified = document.getElementById('alreadyVerified');
            const resendCooldown = document.getElementById('resendCooldown');
            const countdownEl = document.getElementById('countdown');
            const skipVerifyBtn = document.getElementById('skipVerifyBtn');

            let resendTimer = null;

            function showMessage(text, type) {
                messageBox.textContent = text;
                messageBox.className = `message ${type}`;
            }

            function clearMessage() {
                messageBox.className = 'message';
                messageBox.textContent = '';
            }

            function getCode() {
                return Array.from(digits).map(d => d.value).join('');
            }

            function updateVerifyBtn() {
                const code = getCode();
                verifyBtn.disabled = code.length !== 6 || !/^\d{6}$/.test(code);
            }

            function resetCodeInputs() {
                digits.forEach(d => {
                    d.value = '';
                    d.classList.remove('filled', 'success', 'error');
                });
                updateVerifyBtn();
            }

            // Focus management for digit inputs
            digits.forEach((input, idx) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/\D/g, '');
                    e.target.value = val.slice(0, 1);
                    if (val && idx < 5) {
                        digits[idx + 1].focus();
                    }
                    input.classList.toggle('filled', !!val);
                    clearMessage();
                    updateVerifyBtn();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        digits[idx - 1].focus();
                        digits[idx - 1].value = '';
                        digits[idx - 1].classList.remove('filled');
                        updateVerifyBtn();
                    }
                    if (e.key === 'Enter') {
                        verifyBtn.click();
                    }
                });

                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                    if (pasted.length === 6) {
                        digits.forEach((d, i) => {
                            d.value = pasted[i] || '';
                            d.classList.toggle('filled', !!pasted[i]);
                        });
                        digits[5].focus();
                        updateVerifyBtn();
                    }
                });
            });

            // Get user info on load
            async function init() {
                try {
                    const resp = await fetch('/api/auth/me');
                    const data = await resp.json();

                    if (!data.userId) {
                        window.location.href = '/login.html';
                        return;
                    }

                    if (data.emailVerified) {
                        verifyCard.classList.add('is-hidden');
                        alreadyVerified.classList.remove('is-hidden');
                        return;
                    }

                    emailDisplay.textContent = data.email || 'your email';
                    resendPrompt.classList.add('is-hidden');
                    resendBtn.classList.add('is-hidden');
                    digits[0].focus();
                } catch (err) {
                    showMessage('Failed to load user info. Please refresh the page.', 'error');
                }
            }

            // Verify button click
            verifyBtn.addEventListener('click', async () => {
                const code = getCode();
                if (code.length !== 6) return;

                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<span class="spinner"></span>Verifying...';
                clearMessage();

                try {
                    const resp = await fetch('/api/auth/verify-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code }),
                    });

                    const result = await resp.json();

                    if (resp.ok) {
                        digits.forEach(d => d.classList.add('success'));
                        showMessage('Email verified successfully! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        digits.forEach(d => d.classList.add('error'));
                        showMessage(result.error || 'Verification failed', 'error');
                        setTimeout(() => {
                            digits.forEach(d => d.classList.remove('error'));
                        }, 600);
                        verifyBtn.disabled = false;
                        verifyBtn.textContent = 'Verify Email';
                    }
                } catch (err) {
                    showMessage('Network error. Please try again.', 'error');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify Email';
                }
            });

            // Resend button
            function startResendCooldown(seconds) {
                sendCodeBtn.classList.add('is-hidden');
                resendPrompt.classList.add('is-hidden');
                resendBtn.classList.add('is-hidden');
                resendCooldown.classList.remove('is-hidden');
                let remaining = seconds;
                countdownEl.textContent = `${remaining}s`;

                resendTimer = setInterval(() => {
                    remaining--;
                    countdownEl.textContent = `${remaining}s`;
                    if (remaining <= 0) {
                        clearInterval(resendTimer);
                        resendPrompt.classList.remove('is-hidden');
                        resendBtn.classList.remove('is-hidden');
                        resendBtn.disabled = false;
                        resendCooldown.classList.add('is-hidden');
                    }
                }, 1000);
            }

            async function requestVerificationCode(triggerButton) {
                triggerButton.disabled = true;
                clearMessage();

                try {
                    const resp = await fetch('/api/auth/resend-verification', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                    });

                    const result = await resp.json();

                    if (resp.ok) {
                        showMessage((result.message || 'Verification code sent! Check your email.') + ' If you do not see it, check Spam/Promotions.', 'success');
                        resetCodeInputs();
                        digits[0].focus();
                        startResendCooldown(30);
                    } else {
                        showMessage(result.error || 'Failed to send code', 'error');
                        triggerButton.disabled = false;
                    }
                } catch (err) {
                    showMessage('Network error. Please try again.', 'error');
                    triggerButton.disabled = false;
                }
            }

            sendCodeBtn.addEventListener('click', async () => {
                await requestVerificationCode(sendCodeBtn);
            });

            resendBtn.addEventListener('click', async () => {
                await requestVerificationCode(resendBtn);
            });

            if (skipVerifyBtn) {
                skipVerifyBtn.addEventListener('click', () => {
                    window.location.href = '/';
                });
            }

            init();
        </script>
    </body>
</html>
