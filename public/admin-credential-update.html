<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Admin Credentials - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js?v=20260302"></script>
        <style>
            :root {
                --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
                --color-primary-900: #0f172a;
                --color-primary-800: #1d2e4a;
                --color-accent-500: #c48a5a;
                --color-accent-600: #a86c44;
                --color-surface: #fcf9f4;
                --color-surface-soft: #f3ede3;
                --color-border-soft: #d8cebc;
                --color-text-primary: #1c2738;
                --color-text-muted: #616b7b;
                --gradient-bg-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --gradient-accent-main: linear-gradient(145deg, #d0a273 0%, #b2774a 100%);
                --gradient-accent-hover: linear-gradient(145deg, #ddb286 0%, #c48a5a 100%);
                --radius-sm: 10px;
                --radius-md: 14px;
                --shadow-1: 0 10px 24px rgba(10, 18, 33, 0.16);
                --shadow-2: 0 24px 64px rgba(10, 18, 33, 0.32);
                --motion-fast: 220ms;
                --motion-shine: 420ms;
                --motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
                --motion-standard: ease;
                --control-radius: 11px;
                --input-radius: 12px;
                --control-letter: 0.45px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-family-base);
                background:
                    radial-gradient(circle at 14% 12%, rgba(196, 138, 90, 0.2), transparent 42%),
                    radial-gradient(circle at 90% 0%, rgba(244, 227, 202, 0.14), transparent 38%),
                    var(--gradient-bg-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
            }

            .cred-container {
                width: 100%;
                max-width: 550px;
            }

            .cred-card {
                background: linear-gradient(160deg, color-mix(in srgb, var(--color-surface) 96%, white) 0%, var(--color-surface) 100%);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-2);
                padding: 50px 40px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 76%, white);
                animation: cardEntrance 420ms var(--motion-ease) both;
            }

            .cred-header {
                text-align: center;
                margin-bottom: 40px;
            }

            .cred-icon {
                font-size: 3rem;
                margin-bottom: 16px;
            }

            h1 {
                color: var(--color-primary-900);
                font-size: 2rem;
                font-weight: 600;
                margin-bottom: 8px;
                letter-spacing: 0.5px;
            }

            .cred-subtitle {
                color: var(--color-text-muted);
                font-size: 0.95rem;
                font-weight: 300;
                letter-spacing: 0.3px;
                max-width: 58ch;
                margin-left: auto;
                margin-right: auto;
                line-height: 1.6;
            }

            .current-username-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-top: 14px;
                padding: 6px 14px;
                border-radius: 999px;
                background: linear-gradient(135deg, #eef2ff, #e8ecf9);
                color: var(--color-primary-900);
                font-size: 0.88rem;
                font-weight: 700;
                border: 1px solid #c7d2fe;
            }

            form {
                display: flex;
                flex-direction: column;
            }

            .form-group {
                margin-bottom: 28px;
            }

            label {
                display: block;
                margin-bottom: 10px;
                color: var(--color-text-primary);
                font-weight: 600;
                font-size: 0.95rem;
                letter-spacing: 0.4px;
            }

            input[type="text"],
            input[type="password"] {
                width: 100%;
                padding: 14px 16px;
                border: 2px solid color-mix(in srgb, var(--color-border-soft) 72%, white);
                border-radius: var(--input-radius);
                font-size: 1rem;
                font-family: var(--font-family-base);
                background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(248,243,236,0.92) 100%);
                color: var(--color-text-primary);
                transition:
                    transform var(--motion-fast) var(--motion-ease),
                    box-shadow var(--motion-fast) var(--motion-standard),
                    border-color var(--motion-fast) var(--motion-standard);
            }

            input[type="text"]:focus,
            input[type="password"]:focus {
                outline: none;
                border-color: #d4a574;
                background-color: #ffffff;
                box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
            }

            .input-hint {
                font-size: 0.85rem;
                color: var(--color-text-muted);
                margin-top: 6px;
                font-weight: 400;
            }

            button {
                width: 100%;
                background: var(--gradient-accent-main);
                color: var(--color-surface);
                padding: 14px 24px;
                border: none;
                border-radius: var(--control-radius);
                cursor: pointer;
                font-size: 1rem;
                font-weight: 600;
                letter-spacing: var(--control-letter);
                transition: transform var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-standard), background var(--motion-fast) var(--motion-standard);
                box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3);
                margin-bottom: 12px;
                position: relative;
                overflow: hidden;
            }

            button::before {
                content: '';
                position: absolute;
                top: 0;
                left: -120%;
                width: 60%;
                height: 100%;
                background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.44) 50%, transparent 100%);
                transition: left var(--motion-shine) var(--motion-standard);
            }

            button:hover::before { left: 115%; }

            button:hover {
                background: var(--gradient-accent-hover);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(212, 165, 116, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.8;
                cursor: not-allowed;
            }

            button:disabled:hover {
                transform: none;
            }

            .cancel-btn {
                background: #ecf0f1;
                color: #2c3e50;
                box-shadow: none;
            }

            .cancel-btn:hover {
                background: #dfe6e9;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .reset-btn {
                background: transparent;
                color: var(--color-text-muted);
                box-shadow: none;
                border: 1px solid var(--color-border-soft);
            }

            .reset-btn:hover {
                background: var(--color-surface-soft);
                box-shadow: none;
            }

            .spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .message {
                margin-bottom: 20px;
                padding: 14px 16px;
                border-radius: 6px;
                font-weight: 600;
                text-align: center;
                font-size: 0.95rem;
                display: none;
                animation: slideIn 0.4s var(--motion-ease);
            }

            .message.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                display: block;
            }

            .message.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
                display: block;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: var(--color-accent-500);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.9rem;
                transition: color 0.3s ease;
            }

            .back-link a:hover {
                color: #e8b896;
                text-decoration: underline;
            }

            .loading-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--color-text-muted);
            }

            .loading-spinner {
                display: inline-block;
                width: 40px;
                height: 40px;
                border: 4px solid #d4a574;
                border-top-color: transparent;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-bottom: 20px;
            }

            .is-hidden {
                display: none !important;
            }

            @keyframes cardEntrance {
                from { opacity: 0; transform: translateY(12px) scale(0.985); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }

            /* Toast Notifications */
            .toast-container {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                max-width: 400px;
            }

            .toast {
                background: var(--color-surface);
                padding: 16px 20px;
                border-radius: 8px;
                margin-bottom: 12px;
                box-shadow: var(--shadow-1);
                display: flex;
                align-items: center;
                gap: 12px;
                animation: toastSlideIn 0.4s var(--motion-ease);
                min-height: 48px;
            }

            .toast.success { border-left: 4px solid #4CAF50; }
            .toast.error { border-left: 4px solid #f44336; }
            .toast.info { border-left: 4px solid #2196F3; }
            .toast.warning { border-left: 4px solid #FF9800; }

            .toast-icon { font-size: 1.2rem; flex-shrink: 0; }
            .toast-message { flex: 1; font-size: 0.95rem; color: #333; font-weight: 500; }
            .toast-close { cursor: pointer; font-size: 1.2rem; color: #999; flex-shrink: 0; transition: color 0.2s; }
            .toast-close:hover { color: #333; }

            @keyframes toastSlideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }

            @media (max-width: 480px) {
                .cred-card {
                    padding: 30px 20px;
                }

                h1 {
                    font-size: 1.6rem;
                }

                .cred-icon {
                    font-size: 2.5rem;
                }
            }

            @media (max-width: 600px) {
                .toast-container {
                    right: 10px;
                    left: 10px;
                    max-width: none;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .cred-card,
                input[type="text"],
                input[type="password"],
                button {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body data-brand-page="admin-credential-update">
        <div class="toast-container" id="toastContainer"></div>

        <div class="cred-container">
            <!-- Loading state -->
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Verifying access...</p>
            </div>

            <!-- Main card (hidden until super admin verified) -->
            <div id="credCard" class="cred-card is-hidden">
                <div class="cred-header">
                    <div class="cred-icon">🔑</div>
                    <h1>Admin Credentials</h1>
                    <p class="cred-subtitle">Update your Super Admin username or password. This page is exclusive to the Super Admin account.</p>
                    <div class="current-username-badge">👑 Current: <span id="currentAdminUsername">—</span></div>
                </div>

                <form id="credForm" novalidate>
                    <div id="message" class="message" role="alert"></div>

                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter your current password"
                            autocomplete="current-password"
                            required
                        />
                        <div class="input-hint">Required to authorise any changes</div>
                    </div>

                    <div class="form-group">
                        <label for="newUsername">New Username</label>
                        <input
                            type="text"
                            id="newUsername"
                            placeholder="Keep or change admin username"
                            autocomplete="username"
                        />
                        <div class="input-hint">Leave unchanged to keep your current username</div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Leave blank to keep existing"
                            autocomplete="new-password"
                        />
                        <div class="input-hint">Minimum 6 characters</div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-type new password"
                            autocomplete="new-password"
                        />
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="btnText">Save Credentials</span>
                    </button>
                    <button type="button" class="reset-btn" id="resetBtn">Reset Form</button>
                    <button type="button" class="cancel-btn" id="cancelBtn">← Back to Dashboard</button>
                </form>

                <div class="back-link">
                    <a href="/admin-profile.html">← Back to Admin Dashboard</a>
                </div>
            </div>
        </div>

        <script>
            // Toast notification system
            function showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                if (!container) return null;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
                toast.innerHTML = `
                    <span class="toast-icon">${icons[type] || icons.info}</span>
                    <span class="toast-message">${message}</span>
                    <span class="toast-close">&times;</span>
                `;
                container.appendChild(toast);
                const closeBtn = toast.querySelector('.toast-close');
                if (closeBtn) closeBtn.addEventListener('click', () => toast.remove());
                if (duration > 0) setTimeout(() => { if (toast.parentElement) toast.remove(); }, duration);
                return toast;
            }

            const loadingState = document.getElementById('loadingState');
            const credCard = document.getElementById('credCard');
            const credForm = document.getElementById('credForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const currentPasswordInput = document.getElementById('currentPassword');
            const newUsernameInput = document.getElementById('newUsername');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            let cachedAdminUsername = '';

            function showMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
            }

            function clearMessage() {
                messageDiv.className = 'message';
                messageDiv.textContent = '';
            }

            function resetForm() {
                currentPasswordInput.value = '';
                newUsernameInput.value = cachedAdminUsername;
                newPasswordInput.value = '';
                confirmPasswordInput.value = '';
                clearMessage();
            }

            // Verify super admin access and load profile
            async function init() {
                try {
                    const meResponse = await fetch('/api/auth/me');
                    if (!meResponse.ok) throw new Error('Not logged in');
                    const currentUser = await meResponse.json();

                    if (!currentUser.isSuperAdmin) {
                        // Not a super admin — redirect away
                        showToast('Access restricted to Super Admin', 'error', 2000);
                        setTimeout(() => {
                            if (currentUser.isAdmin) {
                                window.location.href = '/promoted-admin-profile.html';
                            } else {
                                window.location.href = '/profile.html';
                            }
                        }, 600);
                        return;
                    }

                    // Load admin profile to get current username
                    const profileResponse = await fetch('/api/admin/profile');
                    if (profileResponse.ok) {
                        const profile = await profileResponse.json();
                        cachedAdminUsername = profile.username;
                        document.getElementById('currentAdminUsername').textContent = profile.username;
                        newUsernameInput.value = profile.username;
                    }

                    // Show the form
                    loadingState.classList.add('is-hidden');
                    credCard.classList.remove('is-hidden');
                } catch (err) {
                    console.error('Init error:', err);
                    window.location.href = '/login.html';
                }
            }

            resetBtn.addEventListener('click', () => {
                resetForm();
                showToast('Form reset', 'info', 1400);
            });

            cancelBtn.addEventListener('click', () => {
                window.location.href = '/admin-profile.html';
            });

            credForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();

                const currentPassword = (currentPasswordInput.value || '').trim();
                const newUsername = (newUsernameInput.value || '').trim();
                const newPassword = (newPasswordInput.value || '').trim();
                const confirmPassword = (confirmPasswordInput.value || '').trim();

                if (!currentPassword) {
                    showMessage('Enter your current password');
                    currentPasswordInput.focus();
                    return;
                }

                if (newPassword && newPassword.length < 6) {
                    showMessage('New password must be at least 6 characters');
                    newPasswordInput.focus();
                    return;
                }

                if (newPassword && newPassword !== confirmPassword) {
                    showMessage('New passwords do not match');
                    confirmPasswordInput.focus();
                    return;
                }

                const usernameChanged = newUsername && newUsername !== cachedAdminUsername;
                const passwordChanged = Boolean(newPassword);

                if (!usernameChanged && !passwordChanged) {
                    showToast('Nothing to update', 'warning');
                    return;
                }

                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                btnText.innerHTML = '<span class="spinner"></span>Saving...';

                const payload = { currentPassword };
                if (usernameChanged) payload.newUsername = newUsername;
                if (passwordChanged) payload.newPassword = newPassword;

                try {
                    const response = await fetch('/api/admin/credentials', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        showMessage(result.error || 'Update failed');
                        submitBtn.disabled = false;
                        btnText.textContent = originalText;
                        return;
                    }

                    cachedAdminUsername = result.username || newUsername || cachedAdminUsername;
                    document.getElementById('currentAdminUsername').textContent = cachedAdminUsername;
                    newUsernameInput.value = cachedAdminUsername;
                    resetForm();
                    showToast('Admin credentials updated!', 'success', 2000);
                } catch (err) {
                    console.error('Credentials update error:', err);
                    showMessage('Unable to update credentials');
                }

                submitBtn.disabled = false;
                btnText.textContent = originalText;
            });

            // Init on load
            init();
        </script>
    </body>
</html>
