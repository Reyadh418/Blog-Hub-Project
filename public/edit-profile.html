<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Profile - Blog Hub</title>
        <link rel="stylesheet" href="/ui-primitives.css" />
        <script src="/csrf.js"></script>
        <script src="/brand-expression.js"></script>
        <script src="/page-transitions.js?v=20260302"></script>
        <script src="/text-formatting.js?v=20260302"></script>
        <style>
            :root {
                --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
                --color-primary-900: #0f172a;
                --color-primary-800: #1d2e4a;
                --color-accent-500: #c48a5a;
                --color-accent-600: #a86c44;
                --color-surface: #fcf9f4;
                --color-surface-soft: #f3ede3;
                --color-border-soft: #d8cebc;
                --color-text-primary: #1c2738;
                --color-text-muted: #616b7b;
                --gradient-bg-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
                --gradient-accent-main: linear-gradient(145deg, #d0a273 0%, #b2774a 100%);
                --gradient-accent-hover: linear-gradient(145deg, #ddb286 0%, #c48a5a 100%);
                --radius-sm: 10px;
                --radius-md: 14px;
                --shadow-1: 0 10px 24px rgba(10, 18, 33, 0.16);
                --shadow-2: 0 24px 64px rgba(10, 18, 33, 0.32);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-family-base);
                background:
                    radial-gradient(circle at 14% 12%, rgba(196, 138, 90, 0.2), transparent 42%),
                    radial-gradient(circle at 90% 0%, rgba(244, 227, 202, 0.14), transparent 38%),
                    var(--gradient-bg-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
            }

            .edit-container {
                width: 100%;
                max-width: 550px;
            }

            .edit-card {
                background: var(--color-surface);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-2);
                padding: 50px 40px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 76%, white);
            }

            .edit-header {
                text-align: center;
                margin-bottom: 40px;
            }

            .edit-icon {
                font-size: 3rem;
                margin-bottom: 16px;
            }

            h1 {
                color: var(--color-primary-900);
                font-size: 2rem;
                font-weight: 600;
                margin-bottom: 8px;
                letter-spacing: 0.5px;
            }

            .edit-subtitle {
                color: var(--color-text-muted);
                font-size: 0.95rem;
                font-weight: 300;
                letter-spacing: 0.3px;
                max-width: 58ch;
                margin-left: auto;
                margin-right: auto;
                line-height: 1.6;
            }

            form {
                display: flex;
                flex-direction: column;
            }

            .form-group {
                margin-bottom: 28px;
            }

            label {
                display: block;
                margin-bottom: 10px;
                color: var(--color-text-primary);
                font-weight: 600;
                font-size: 0.95rem;
                letter-spacing: 0.4px;
            }

            input[type="text"],
            input[type="email"],
            textarea {
                width: 100%;
                padding: 14px 16px;
                border: 2px solid #e8e8e8;
                border-radius: 6px;
                font-size: 1rem;
                font-family: var(--font-family-base);
                transition: all 0.3s ease;
                background-color: #f8f9fa;
                color: var(--color-text-primary);
            }

            input[type="text"]:focus,
            input[type="email"]:focus,
            textarea:focus {
                outline: none;
                border-color: #d4a574;
                background-color: #ffffff;
                box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
            }

            input:disabled {
                background-color: #ecf0f1;
                color: #95a5a6;
                cursor: not-allowed;
                border-color: #bdc3c7;
            }

            input::placeholder {
                color: #bdc3c7;
            }

            textarea {
                resize: vertical;
                min-height: 140px;
                line-height: 1.6;
            }

            .input-hint {
                font-size: 0.85rem;
                color: var(--color-text-muted);
                margin-top: 6px;
                font-weight: 400;
            }

            .disabled-hint {
                font-size: 0.85rem;
                color: #e74c3c;
                margin-top: 6px;
                font-weight: 500;
            }

            .word-counter {
                font-size: 0.85rem;
                color: var(--color-accent-500);
                margin-top: 8px;
                font-weight: 600;
                text-align: right;
            }

            .format-toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 12px;
            }

            .format-btn {
                width: auto;
                margin-bottom: 0;
                padding: 8px 12px;
                font-size: 0.82rem;
                font-weight: 700;
                border-radius: 9px;
                border: 1px solid color-mix(in srgb, var(--color-border-soft) 70%, white);
                background: linear-gradient(160deg, rgba(255, 255, 255, 0.95) 0%, rgba(243, 237, 227, 0.88) 100%);
                color: var(--color-primary-900);
                cursor: pointer;
                box-shadow: none;
                letter-spacing: 0.25px;
            }

            .format-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
            }

            .format-help {
                margin-top: 8px;
                font-size: 0.82rem;
                color: var(--color-text-muted);
            }

            .word-counter.warning {
                color: #f39c12;
            }

            .word-counter.error {
                color: #e74c3c;
            }

            button {
                width: 100%;
                background: var(--gradient-accent-main);
                color: var(--color-surface);
                padding: 14px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 1rem;
                font-weight: 600;
                letter-spacing: 1px;
                transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3);
                margin-bottom: 12px;
            }

            button:hover {
                background: var(--gradient-accent-hover);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(212, 165, 116, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.8;
                cursor: not-allowed;
            }

            button:disabled:hover {
                transform: none;
            }

            .cancel-btn {
                background: #ecf0f1;
                color: #2c3e50;
                box-shadow: none;
            }

            .cancel-btn:hover {
                background: #dfe6e9;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .message {
                margin-bottom: 20px;
                padding: 14px 16px;
                border-radius: 6px;
                font-weight: 600;
                text-align: center;
                font-size: 0.95rem;
                display: none;
                animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .message.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                display: block;
            }

            .message.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
                display: block;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: var(--color-accent-500);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.9rem;
                transition: color 0.3s ease;
            }

            .back-link a:hover {
                color: #e8b896;
                text-decoration: underline;
            }

            @media (max-width: 480px) {
                .edit-card {
                    padding: 30px 20px;
                }

                h1 {
                    font-size: 1.6rem;
                }

                .edit-icon {
                    font-size: 2.5rem;
                }
            }

            /* Toast Notifications */
            .toast-container {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                max-width: 400px;
            }

            .toast {
                background: var(--color-surface);
                padding: 16px 20px;
                border-radius: 8px;
                margin-bottom: 12px;
                box-shadow: var(--shadow-1);
                display: flex;
                align-items: center;
                gap: 12px;
                animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                min-height: 48px;
            }

            .toast.success {
                border-left: 4px solid #4CAF50;
            }

            .toast.error {
                border-left: 4px solid #f44336;
            }

            .toast-icon {
                font-size: 1.2rem;
                flex-shrink: 0;
            }

            .toast-message {
                flex: 1;
                font-size: 0.95rem;
                color: #333;
                font-weight: 500;
            }

            .toast-close {
                cursor: pointer;
                font-size: 1.2rem;
                color: #999;
                flex-shrink: 0;
                transition: color 0.2s;
            }

            .toast-close:hover {
                color: #333;
            }

            @keyframes slideIn {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @media (max-width: 600px) {
                .toast-container {
                    right: 10px;
                    left: 10px;
                    max-width: none;
                }
            }

            .edit-card {
                background: linear-gradient(160deg, color-mix(in srgb, var(--color-surface) 96%, white) 0%, var(--color-surface) 100%);
                animation: cardEntrance 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            input[type="text"],
            input[type="email"],
            textarea {
                border-radius: 12px;
                border-color: color-mix(in srgb, var(--color-border-soft) 72%, white);
                background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(248,243,236,0.92) 100%);
            }

            button {
                position: relative;
                overflow: hidden;
                border-radius: 11px;
                transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 220ms ease, background 220ms ease;
            }

            button::before {
                content: '';
                position: absolute;
                top: 0;
                left: -120%;
                width: 60%;
                height: 100%;
                background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.44) 50%, transparent 100%);
                transition: left 420ms ease;
            }

            button:hover::before { left: 115%; }

            @keyframes cardEntrance {
                from { opacity: 0; transform: translateY(12px) scale(0.985); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }

            :root {
                --motion-fast: 220ms;
                --motion-shine: 420ms;
                --motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
                --motion-standard: ease;
                --control-radius: 11px;
                --input-radius: 12px;
                --control-letter: 0.45px;
            }

            button,
            .submit-btn,
            .verify-btn,
            .resend-btn,
            .skip-btn,
            .continue-btn,
            .toggle-btn,
            .form-actions button,
            .edit-actions button,
            .navbar-actions button,
            .toolbar button,
            .btn,
            .action-btn {
                border-radius: var(--control-radius) !important;
                letter-spacing: var(--control-letter);
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="search"],
            select,
            textarea,
            .field-wrap,
            .field-input {
                border-radius: var(--input-radius);
            }

            input[type="text"],
            input[type="email"],
            textarea,
            button,
            .toast,
            .toast-close {
                transition:
                    transform var(--motion-fast) var(--motion-ease),
                    box-shadow var(--motion-fast) var(--motion-standard),
                    background var(--motion-fast) var(--motion-standard),
                    border-color var(--motion-fast) var(--motion-standard),
                    color var(--motion-fast) var(--motion-standard);
            }

            button::before {
                transition: left var(--motion-shine) var(--motion-standard);
            }

            @media (prefers-reduced-motion: reduce) {
                .edit-card,
                input[type="text"],
                input[type="email"],
                textarea,
                button {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body data-brand-page="edit-profile">
        <div class="toast-container" id="toastContainer"></div>

        <div class="edit-container">
            <div class="edit-card">
                <div class="edit-header">
                    <div class="edit-icon">✏️</div>
                    <h1>Edit Profile</h1>
                    <p class="edit-subtitle">Update your account information</p>
                </div>

                <form id="editForm" novalidate>
                    <div id="message" class="message" role="alert"></div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            disabled
                            placeholder="Your username"
                        />
                        <div class="disabled-hint">⚠️ Username cannot be changed</div>
                    </div>

                    <div class="form-group">
                        <label for="accountName">Account Name</label>
                        <input 
                            type="text" 
                            id="accountName" 
                            placeholder="Enter your full name"
                            autocomplete="name"
                        />
                        <div class="input-hint">This is how you appear to other users</div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Enter your email"
                            autocomplete="email"
                        />
                        <div class="input-hint">We use this to recover your account</div>
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <div class="format-toolbar" id="bioFormatToolbar" aria-label="Formatting controls">
                            <button type="button" class="format-btn" data-format="bold"><strong>B</strong></button>
                            <button type="button" class="format-btn" data-format="italic"><em>I</em></button>
                            <button type="button" class="format-btn" data-format="h2">H2</button>
                            <button type="button" class="format-btn" data-format="quote">Quote</button>
                            <button type="button" class="format-btn" data-format="list">List</button>
                            <button type="button" class="format-btn" data-format="link">Link</button>
                            <button type="button" class="format-btn" data-format="code">Code</button>
                        </div>
                        <textarea 
                            id="bio" 
                            placeholder="Tell us about yourself... (maximum 111 words)"
                        ></textarea>
                        <div class="format-help">Supports: headings, bold, italic, quotes, lists, links, and inline code.</div>
                        <div class="word-counter" id="wordCounter">0 / 111 words</div>
                    </div>

                    <button type="submit" id="submitBtn">
                        <span id="btnText">Save Changes</span>
                    </button>
                    <button type="button" class="cancel-btn" id="cancelBtn">
                        Cancel
                    </button>
                </form>

                <div class="back-link">
                    <a href="#" id="backLink">← Back to Profile</a>
                </div>
            </div>
        </div>

        <script>
            // Toast notification system
            function showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                if (!container) return null;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;

                const icons = {
                    success: '✓',
                    error: '✕',
                    info: 'ℹ',
                    warning: '⚠'
                };

                toast.innerHTML = `
                    <span class="toast-icon">${icons[type] || icons.info}</span>
                    <span class="toast-message">${message}</span>
                    <span class="toast-close">&times;</span>
                `;

                container.appendChild(toast);

                const closeBtn = toast.querySelector('.toast-close');
                if (closeBtn) closeBtn.addEventListener('click', () => {
                    toast.classList.add('is-exiting');
                    setTimeout(() => toast.remove(), 300);
                });

                if (duration > 0) {
                    setTimeout(() => {
                        if (toast.parentElement) {
                            toast.classList.add('is-exiting');
                            setTimeout(() => toast.remove(), 300);
                        }
                    }, duration);
                }

                return toast;
            }

            const editForm = document.getElementById('editForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const bioInput = document.getElementById('bio');
            const bioFormatToolbar = document.getElementById('bioFormatToolbar');
            const wordCounter = document.getElementById('wordCounter');
            const MAX_WORDS = 111;

            if (window.TextFormatting && bioFormatToolbar) {
                window.TextFormatting.bindToolbar(bioFormatToolbar, bioInput);
            }

            // Word counter for bio
            bioInput.addEventListener('input', function() {
                const text = this.value.trim();
                const wordCount = text ? text.split(/\s+/).length : 0;
                const remaining = MAX_WORDS - wordCount;

                wordCounter.textContent = `${wordCount} / ${MAX_WORDS} words`;
                wordCounter.className = 'word-counter';

                if (wordCount > MAX_WORDS) {
                    wordCounter.classList.add('error');
                } else if (wordCount > MAX_WORDS - 10) {
                    wordCounter.classList.add('warning');
                }

                // Prevent further input if limit exceeded
                if (wordCount > MAX_WORDS) {
                    // Trim to max words
                    const words = text.split(/\s+/).slice(0, MAX_WORDS);
                    this.value = words.join(' ');
                    wordCounter.textContent = `${MAX_WORDS} / ${MAX_WORDS} words`;
                    wordCounter.classList.remove('warning');
                    wordCounter.classList.add('error');
                }
            });

            function showMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
            }

            function validateForm() {
                const accountName = document.getElementById('accountName').value.trim();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const bio = document.getElementById('bio').value.trim();
                const bioWordCount = bio ? bio.split(/\s+/).length : 0;

                if (!accountName) {
                    showMessage('Please enter your account name', 'error');
                    document.getElementById('accountName').focus();
                    return false;
                }

                if (!email) {
                    showMessage('Please enter your email', 'error');
                    document.getElementById('email').focus();
                    return false;
                }

                if (!email.includes('@')) {
                    showMessage('Please enter a valid email address', 'error');
                    document.getElementById('email').focus();
                    return false;
                }

                if (bioWordCount > MAX_WORDS) {
                    showMessage(`Bio must be ${MAX_WORDS} words or less`, 'error');
                    document.getElementById('bio').focus();
                    return false;
                }

                return true;
            }

            // Load current user profile
            async function loadProfile() {
                try {
                    const response = await fetch('/api/auth/me');
                    if (!response.ok) {
                        throw new Error('Not logged in');
                    }

                    const user = await response.json();

                    // Super admins have their own profile management
                    if (user.isSuperAdmin) {
                        window.location.href = '/admin-profile.html';
                        return;
                    }

                    // Promoted admins can edit their profile here
                    // Regular users also use this page

                    // Determine correct profile page for navigation
                    const profilePage = user.isAdmin ? '/promoted-admin-profile.html' : '/profile.html';
                    
                    // Update navigation links
                    document.getElementById('cancelBtn').onclick = () => window.location.href = profilePage;
                    document.getElementById('backLink').href = profilePage;
                    
                    // Store for later use
                    window.currentProfilePage = profilePage;

                    // Populate form with user data
                    document.getElementById('username').value = user.username || '';
                    document.getElementById('accountName').value = user.full_name || user.fullName || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('bio').value = user.bio || '';

                    // Update word counter
                    const bioText = user.bio || '';
                    const wordCount = bioText.trim() ? bioText.trim().split(/\s+/).length : 0;
                    wordCounter.textContent = `${wordCount} / ${MAX_WORDS} words`;
                } catch (error) {
                    console.error('Load profile error:', error);
                    window.location.href = '/login.html';
                }
            }

            editForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                btnText.innerHTML = '<span class="spinner"></span>Saving...';

                try {
                    const accountName = document.getElementById('accountName').value.trim();
                    const email = document.getElementById('email').value.trim().toLowerCase();
                    const bio = document.getElementById('bio').value.trim();

                    const response = await fetch('/api/auth/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            full_name: accountName,
                            email: email,
                            bio: bio 
                        }),
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showToast('Profile updated successfully!', 'success', 1500);
                        setTimeout(() => {
                            window.location.href = window.currentProfilePage || '/profile.html';
                        }, 800);
                    } else {
                        showToast(result.error || 'Update failed. Please try again.', 'error');
                        submitBtn.disabled = false;
                        btnText.textContent = originalText;
                    }
                } catch (error) {
                    console.error('Update error:', error);
                    showToast('Error: ' + error.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                }
            });

            // Load profile on page load
            loadProfile();
        </script>
    </body>
</html>
