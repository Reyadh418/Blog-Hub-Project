<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View User - Admin</title>
    <link rel="stylesheet" href="/ui-primitives.css" />
    <script src="/csrf.js"></script>
    <script src="/brand-expression.js"></script>
    <script src="/page-transitions.js?v=20260302"></script>
    <script src="/text-formatting.js?v=20260302"></script>
    <style>
        :root {
            --font-family-base: Inter, 'Segoe UI', Trebuchet MS, sans-serif;
            --color-primary-900: #0f172a;
            --color-primary-800: #1d2e4a;
            --color-accent-500: #c48a5a;
            --color-surface: #fcf9f4;
            --color-surface-soft: #f3ede3;
            --color-border-soft: #d8cebc;
            --color-text-primary: #1c2738;
            --color-text-muted: #616b7b;
            --gradient-bg-main: linear-gradient(145deg, #f7f2e9 0%, #ece4d7 100%);
            --gradient-primary-main: linear-gradient(160deg, #0f172a 0%, #1d2e4a 52%, #244063 100%);
            --radius-sm: 10px;
            --radius-md: 14px;
            --shadow-1: 0 12px 30px rgba(10, 18, 33, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        .is-hidden { display: none !important; }
        body {
            font-family: var(--font-family-base);
            background: var(--gradient-bg-main);
            min-height: 100vh;
            padding: 30px 14px 60px;
        }
        .shell { max-width: 1100px; margin: 0 auto; }
        .nav {
            width: min(1100px, 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 0 auto 24px;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1px solid rgba(245, 234, 214, 0.2);
            background:
                linear-gradient(125deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%),
                linear-gradient(120deg, rgba(15, 23, 42, 0.58) 0%, rgba(25, 40, 62, 0.5) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 16px 32px rgba(9, 16, 31, 0.26);
            backdrop-filter: blur(10px);
        }
        .nav h1 {
            color: rgba(248, 242, 232, 0.98);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            border: 1px solid rgba(245, 234, 214, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            background: linear-gradient(160deg, rgba(248, 242, 232, 0.16) 0%, rgba(248, 242, 232, 0.06) 100%);
        }
        .nav-actions { display: flex; gap: 8px; }
        .btn {
            border: 1px solid rgba(245, 234, 214, 0.18);
            border-radius: 12px;
            padding: 10px 12px;
            min-height: 42px;
            font-weight: 800;
            font-size: 0.72rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
            box-shadow: 0 8px 18px rgba(8, 14, 26, 0.24);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .primary { background: linear-gradient(145deg, #d0a273 0%, #b2774a 100%); color:#fff; border-color: rgba(212, 165, 116, 0.65); }
        .ghost { background: linear-gradient(160deg, rgba(248, 242, 232, 0.14) 0%, rgba(248, 242, 232, 0.06) 100%); color: rgba(248, 242, 232, 0.96); }

        .card {
            background: var(--color-surface);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.14);
            border: 1px solid #e6edf5;
            margin-bottom: 18px;
        }
        .header {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 18px;
            align-items: center;
        }
        .avatar {
            width: 110px; height: 110px; border-radius: 50%;
            display: grid; place-items: center;
            color: #fff; font-weight: 800; font-size: 2.4rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.14);
        }
        .avatar[data-avatar='aurora'] { background: linear-gradient(135deg, #5efce8 0%, #736efe 100%); }
        .avatar[data-avatar='sunset'] { background: linear-gradient(135deg, #f83600 0%, #f9d423 100%); }
        .avatar[data-avatar='wave'] { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .avatar[data-avatar='forest'] { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .avatar[data-avatar='midnight'] { background: linear-gradient(135deg, #141e30 0%, #243b55 100%); }
        .avatar[data-avatar='plum'] { background: linear-gradient(135deg, #cc2b5e 0%, #753a88 100%); }
        .avatar[data-avatar='citrus'] { background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%); }
        .avatar[data-avatar='ember'] { background: linear-gradient(135deg, #e65c00 0%, #f9d423 100%); }
        .avatar[data-avatar='mint'] { background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%); }
        .avatar[data-avatar='default'] { background: linear-gradient(145deg, #d0a273 0%, #b2774a 100%); }
        .name { color:var(--color-primary-900); font-size:1.6rem; font-weight:700; }
        .username { color:var(--color-accent-500); font-weight:700; margin: 4px 0; }
        .email { color:#52606d; margin-bottom: 6px; }
        .bio { color:#2c3e50; line-height:1.6; }

        .bio .profile-bio-paragraph,
        .bio .profile-bio-list,
        .bio .profile-bio-quote,
        .bio .profile-bio-code,
        .bio .profile-bio-heading {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .bio .profile-bio-list { padding-left: 1.2rem; }

        .bio .profile-bio-heading {
            font-size: 1.02rem;
            color: #2e3a4e;
            font-weight: 700;
        }

        .bio .profile-bio-quote {
            border-left: 3px solid rgba(196, 138, 90, 0.5);
            padding-left: 10px;
            color: #4b5563;
        }

        .bio .profile-bio-code {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e5d9c8;
            background: #f7f2ea;
            overflow-x: auto;
        }

        .meta-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
        .pill { background:#eef2f7; border:1px solid #e0e6ee; border-radius:999px; padding:8px 12px; font-weight:700; color:#52606d; }

        .section-title { color:var(--color-primary-900); font-size:1.2rem; font-weight:700; margin-bottom:12px; }
        .section-title.error-title { color:#c0392b; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
        .item-card {
            background: linear-gradient(145deg, #ffffff 0%, #f7f9fc 100%);
            border: 1px solid #e6edf5;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); border-color: #c48a5a; }
        .item-title { color:var(--color-primary-900); font-weight:700; margin-bottom:6px; }
        .item-meta { color:#95a5a6; font-size:0.9rem; margin-bottom:6px; line-height:1.45; }
        .item-body { color:#2c3e50; line-height:1.7; max-width:68ch; }
        .item-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
        .item-pill {
            background:#eef2f7;
            border:1px solid #e0e6ee;
            border-radius:999px;
            padding:3px 10px;
            color:#52606d;
            font-size:0.78rem;
            font-weight:700;
            letter-spacing:0.2px;
        }
        .item-pill.category {
            background: rgba(212,165,116,0.16);
            color:#1d2e4a;
            border-color: rgba(212,165,116,0.35);
        }
        .link { color:#4a90e2; font-weight:700; text-decoration:none; }

        .empty { text-align:center; padding:30px 10px; color:var(--color-text-muted); }

        .toast-container { position:fixed; top:20px; right:20px; z-index:10000; max-width:400px; }
        .toast { background:var(--color-surface); padding:14px 16px; border-radius:10px; box-shadow:var(--shadow-1); display:flex; gap:10px; align-items:center; margin-bottom:10px; }
        .toast.success{border-left:4px solid #4CAF50; }
        .toast.error{border-left:4px solid #f44336; }
        .toast .toast-icon { font-weight:700; }
        .toast .toast-message { flex:1; }
        .toast-close { cursor: pointer; }
        .item-link-wrap { margin-top: 8px; }
        .error-text { color:#721c24; }

        @media (max-width: 640px) {
            .shell { padding: 18px 10px 28px; }
            .nav { grid-template-columns: 1fr; justify-items: stretch; text-align: center; gap: 14px; }
            .nav-actions { width: 100%; justify-content: stretch; }
            .nav-actions button { width: 100%; }
            .header { grid-template-columns: 1fr; justify-items: center; text-align:center; padding: 22px 18px; }
            .card { padding: 18px; }
            .avatar { width: 64px; height: 64px; font-size: 1.2rem; }
            .name { font-size: 1.4rem; }
            .meta-row { justify-content: center; }
            .pill { width: 100%; justify-content: center; }
            .grid { grid-template-columns: 1fr; }
            .item-card { padding: 12px; }
        }

        @media (max-width: 480px) {
            .shell { padding: 14px 8px 24px; }
            .nav h1 { font-size: 1.5rem; }
            .card { padding: 16px 14px; }
            .header { padding: 18px 14px; }
            .name { font-size: 1.28rem; }
            .username,
            .email,
            .bio { font-size: 0.92rem; }
            .btn { width: 100%; }
            .empty { padding: 24px 14px; }
        }

        .card {
            background: linear-gradient(160deg, color-mix(in srgb, var(--color-surface) 96%, white) 0%, var(--color-surface) 100%);
        }

        .btn {
            position: relative;
            overflow: hidden;
            border-radius: 11px;
            transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 220ms ease, background 220ms ease;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.42) 50%, transparent 100%);
            transition: left 420ms ease;
        }

        .btn:hover::before { left: 115%; }

        .link {
            color: var(--color-accent-500);
            transition: color 180ms ease;
        }

        .link:hover {
            color: #a86c44;
        }

        :root {
            --motion-fast: 220ms;
            --motion-shine: 420ms;
            --motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
            --motion-standard: ease;
            --control-radius: 11px;
            --input-radius: 12px;
            --control-letter: 0.45px;
        }

        button,
        .submit-btn,
        .verify-btn,
        .resend-btn,
        .skip-btn,
        .continue-btn,
        .toggle-btn,
        .form-actions button,
        .edit-actions button,
        .navbar-actions button,
        .toolbar button,
        .btn,
        .action-btn {
            border-radius: var(--control-radius) !important;
            letter-spacing: var(--control-letter);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="search"],
        select,
        textarea,
        .field-wrap,
        .field-input {
            border-radius: var(--input-radius);
        }

        .btn,
        .card,
        .item-card,
        .link,
        .toast,
        .toast-close {
            transition:
                transform var(--motion-fast) var(--motion-ease),
                box-shadow var(--motion-fast) var(--motion-standard),
                background var(--motion-fast) var(--motion-standard),
                border-color var(--motion-fast) var(--motion-standard),
                color var(--motion-fast) var(--motion-standard),
                opacity var(--motion-fast) var(--motion-standard);
        }

        .btn::before {
            transition: left var(--motion-shine) var(--motion-standard);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn,
            .card,
            .item-card {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body data-brand-page="view-profile">
<div class="shell">
    <div class="toast-container" id="toastContainer"></div>
    <div class="nav">
        <h1>View User (Admin)</h1>
        <div class="nav-actions">
            <button class="btn ghost" onclick="navigateWithTransition('/admin-users.html')">← Users</button>
            <button class="btn primary" onclick="navigateWithTransition('/admin-profile.html')">Admin Home</button>
        </div>
    </div>

    <div class="card is-hidden" id="profileCard">
        <div class="header">
            <div class="avatar" id="avatar">U</div>
            <div>
                <div class="name" id="name">—</div>
                <div class="username" id="username">—</div>
                <div class="email" id="email">—</div>
                <div class="bio" id="bio">—</div>
                <div class="meta-row">
                    <span class="pill" id="joined">Joined: —</span>
                    <span class="pill" id="postCount">Posts: 0</span>
                    <span class="pill" id="commentCount">Comments: 0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card is-hidden" id="postsCard">
        <div class="section-title">Posts</div>
        <div class="grid" id="postsGrid"></div>
        <div class="empty is-hidden" id="postsEmpty">No posts yet.</div>
    </div>

    <div class="card is-hidden" id="commentsCard">
        <div class="section-title">Comments</div>
        <div class="grid" id="commentsGrid"></div>
        <div class="empty is-hidden" id="commentsEmpty">No comments yet.</div>
    </div>

    <div class="card is-hidden" id="errorCard">
        <div class="section-title error-title">Access Restricted</div>
        <p class="error-text">You must be an admin to view this page.</p>
        <button class="btn primary" onclick="navigateWithTransition('/login.html')">Go to Login</button>
    </div>
</div>

<script>
const AVATAR_PALETTE = {
    aurora: 'linear-gradient(135deg, #5efce8 0%, #736efe 100%)',
    sunset: 'linear-gradient(135deg, #f83600 0%, #f9d423 100%)',
    wave: 'linear-gradient(135deg, #00c6ff 0%, #0072ff 100%)',
    forest: 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
    midnight: 'linear-gradient(135deg, #141e30 0%, #243b55 100%)',
    plum: 'linear-gradient(135deg, #cc2b5e 0%, #753a88 100%)',
    citrus: 'linear-gradient(135deg, #fceabb 0%, #f8b500 100%)',
    ember: 'linear-gradient(135deg, #e65c00 0%, #f9d423 100%)',
    mint: 'linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%)',
};
const params = new URLSearchParams(window.location.search);
const userId = params.get('id');
const avatarEl = document.getElementById('avatar');
const nameEl = document.getElementById('name');
const usernameEl = document.getElementById('username');
const emailEl = document.getElementById('email');
const bioEl = document.getElementById('bio');
const joinedEl = document.getElementById('joined');
const postCountEl = document.getElementById('postCount');
const commentCountEl = document.getElementById('commentCount');
const postsGrid = document.getElementById('postsGrid');
const postsEmpty = document.getElementById('postsEmpty');
const commentsGrid = document.getElementById('commentsGrid');
const commentsEmpty = document.getElementById('commentsEmpty');
const profileCard = document.getElementById('profileCard');
const postsCard = document.getElementById('postsCard');
const commentsCard = document.getElementById('commentsCard');
const errorCard = document.getElementById('errorCard');

function avatarStyle(key) { return AVATAR_PALETTE[key] || 'linear-gradient(145deg, #d0a273 0%, #b2774a 100%)'; }
function avatarKey(key) { return Object.prototype.hasOwnProperty.call(AVATAR_PALETTE, key) ? key : 'default'; }
function escapeHtml(str='') { return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#039;'}[m])); }
function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function showToast(message, type='info', duration=2500) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success:'✓', error:'✕', info:'ℹ', warning:'⚠' };
    toast.innerHTML = `<span class="toast-icon">${icons[type]||icons.info}</span><span class="toast-message">${message}</span><span class="toast-close">×</span>`;
    container.appendChild(toast);
    toast.querySelector('.toast-close').onclick = () => toast.remove();
    if (duration>0) setTimeout(()=>toast.remove(), duration);
}

async function ensureAdmin() {
    try {
        const me = await fetch('/api/auth/me').then(r=>r.json());
        if (!me.isAdmin) return false;
        return true;
    } catch (err) {
        return false;
    }
}

async function fetchUserProfile(id) {
    const resp = await fetch(`/api/users/${id}`);
    if (!resp.ok) throw new Error('Failed to load user');
    return resp.json();
}

function renderProfile(user) {
    avatarEl.dataset.avatar = avatarKey(user.avatar || '');
    avatarEl.textContent = (user.username || 'U').charAt(0).toUpperCase();
    nameEl.textContent = user.full_name || user.username || '—';
    usernameEl.textContent = '@' + (user.username || '');
    emailEl.textContent = user.email || '';
    const bioText = user.bio || '';
    if (bioText.trim() && window.TextFormatting) {
        bioEl.innerHTML = window.TextFormatting.toHtml(bioText, {
            classNames: {
                paragraph: 'profile-bio-paragraph',
                heading: 'profile-bio-heading',
                blockquote: 'profile-bio-quote',
                list: 'profile-bio-list',
                listItem: 'profile-bio-list-item',
                codeBlock: 'profile-bio-code'
            }
        });
    } else {
        bioEl.textContent = 'No bio provided.';
    }
    joinedEl.textContent = 'Joined: ' + (user.created_at ? formatDate(user.created_at) : '—');
    postCountEl.textContent = 'Posts: ' + (user.posts ? user.posts.length : 0);
    commentCountEl.textContent = 'Comments: ' + (user.comments ? user.comments.length : 0);
    profileCard.classList.remove('is-hidden');
}

function renderPosts(posts=[]) {
    if (!posts.length) {
        postsEmpty.classList.remove('is-hidden');
        postsCard.classList.remove('is-hidden');
        return;
    }
    postsCard.classList.remove('is-hidden');
    postsEmpty.classList.add('is-hidden');
    const categories = ['Education', 'Stories', 'Mindset', 'Lessons'];
    postsGrid.innerHTML = posts.map(p => `
        <div class="item-card">
            <div class="item-title">${escapeHtml(p.title)}</div>
            <div class="item-meta">${p.created_at ? formatDate(p.created_at) : ''}</div>
            <div class="item-pills">
                <span class="item-pill category">${escapeHtml((p.category || (Array.isArray(p.tags) ? p.tags.find(tag => categories.includes(tag)) : '') || 'Stories'))}</span>
                <span class="item-pill">Story</span>
            </div>
            <div class="item-body">${escapeHtml(window.TextFormatting ? window.TextFormatting.excerpt(p.body || '', 160) : ((p.body || '').slice(0, 160) + ((p.body || '').length > 160 ? '...' : '')))}</div>
            <div class="item-link-wrap"><a class="link" href="/post.html?id=${p.id}">View post →</a></div>
        </div>
    `).join('');
}

function renderComments(comments=[]) {
    if (!comments.length) {
        commentsEmpty.classList.remove('is-hidden');
        commentsCard.classList.remove('is-hidden');
        return;
    }
    commentsCard.classList.remove('is-hidden');
    commentsEmpty.classList.add('is-hidden');
    commentsGrid.innerHTML = comments.map(c => `
        <div class="item-card">
            <div class="item-title">${escapeHtml(c.post_title || 'Post')}</div>
            <div class="item-meta">${c.created_at ? new Date(c.created_at).toLocaleString() : ''}${c.updated_at && c.updated_at !== c.created_at ? ' · edited' : ''}</div>
            <div class="item-pills">
                <span class="item-pill">Comment</span>
                ${c.updated_at && c.updated_at !== c.created_at ? '<span class="item-pill">Edited</span>' : ''}
            </div>
            <div class="item-body">${escapeHtml(window.TextFormatting ? window.TextFormatting.excerpt(c.body || '', 200) : ((c.body || '').slice(0, 200) + ((c.body || '').length > 200 ? '...' : '')))}</div>
            <div class="item-link-wrap"><a class="link" href="/post.html?id=${c.post_id}">Open post →</a></div>
        </div>
    `).join('');
}

async function init() {
    if (!userId) {
        showToast('No user specified', 'error');
        return;
    }
    const isAdmin = await ensureAdmin();
    if (!isAdmin) {
        errorCard.classList.remove('is-hidden');
        return;
    }
    try {
        const user = await fetchUserProfile(userId);
        renderProfile(user);
        renderPosts(user.posts || []);
        renderComments(user.comments || []);
    } catch (err) {
        console.error(err);
        showToast('Unable to load user', 'error');
    }
}

init();
</script>
</body>
</html>
